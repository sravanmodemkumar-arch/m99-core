<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Users</title>
<link rel="stylesheet" href="../shared/admin.css">
</head>
<body>
<div id="role-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">Set Admin Role <button class="modal-close" onclick="closeRoleModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="r-uid">
      <div class="form-group"><label class="form-label">UID</label><input id="r-uid-display" class="form-control" readonly></div>
      <div class="form-group"><label class="form-label">Role</label>
        <select id="r-role" class="form-control">
          <option value="">No admin access</option>
          <option value="product_admin">product_admin</option>
          <option value="super_admin">super_admin</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeRoleModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveRole()">Save Role</button>
    </div>
  </div>
</div>

<script type="module">
import { initAdminShell, adminApi, toast } from "../shared/admin-shell.js";
await initAdminShell({ title: "Users" });

const pageBody = document.getElementById("page-body");
pageBody.innerHTML = `
  <div class="card">
    <div class="card-body" style="padding-bottom:0">
      <div class="search-bar">
        <input id="user-search" class="search-input" placeholder="Search by name or phone…" oninput="debounce()">
        <button class="btn btn-secondary btn-sm" onclick="loadUsers(1)">Search</button>
      </div>
    </div>
    <div class="card-body" style="padding-top:0;padding:0">
      <div class="table-wrap">
        <table>
          <thead><tr><th>UID</th><th>Name</th><th>Phone</th><th>Role</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="users-tbody"><tr><td colspan="5" class="loading-row"><div class="spin"></div></td></tr></tbody>
        </table>
      </div>
      <div id="users-pagination"></div>
    </div>
  </div>`;

let page = 1, searchTimer;
window.debounce = function() { clearTimeout(searchTimer); searchTimer = setTimeout(() => loadUsers(1), 350); };

window.loadUsers = async function(p = page) {
  page = p;
  const tbody = document.getElementById("users-tbody");
  tbody.innerHTML = `<tr><td colspan="5" class="loading-row"><div class="spin"></div></td></tr>`;
  const params = new URLSearchParams({ page, limit: 20, q: document.getElementById("user-search").value.trim() });
  const r = await adminApi(`/users?${params}`);
  if (!r.ok) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:#888">Failed to load</td></tr>`; return; }
  const { users = [], total = 0, limit = 20 } = r.data;
  if (!users.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">👥</div><div class="empty-title">No users found</div></div></td></tr>`;
    document.getElementById("users-pagination").innerHTML = "";
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td><code style="font-size:11px">${u.uid}</code></td>
      <td style="font-weight:600">${u.name || "—"}</td>
      <td>${u.phone || "—"}</td>
      <td><span class="badge ${u.role === "super_admin" ? "badge-red" : u.role === "product_admin" ? "badge-orange" : "badge-gray"}">${u.role || "user"}</span></td>
      <td class="td-actions">
        <button class="btn btn-secondary btn-xs" onclick="openRoleModal('${u.uid}','${(u.role||'')}')">Set Role</button>
      </td>
    </tr>`).join("");

  const pg = document.getElementById("users-pagination");
  const totalPages = Math.ceil(total / limit);
  if (totalPages <= 1) { pg.innerHTML = ""; return; }
  pg.innerHTML = `<div class="pagination">
    <button class="page-btn" ${page<=1?"disabled":""} onclick="loadUsers(${page-1})">‹</button>
    <span style="padding:5px 10px;font-size:12px;color:#888">${page} / ${totalPages}</span>
    <button class="page-btn" ${page>=totalPages?"disabled":""} onclick="loadUsers(${page+1})">›</button>
  </div>`;
};

window.openRoleModal = function(uid, role) {
  document.getElementById("r-uid").value = uid;
  document.getElementById("r-uid-display").value = uid;
  document.getElementById("r-role").value = role || "";
  document.getElementById("role-modal").classList.remove("hidden");
};
window.closeRoleModal = function() { document.getElementById("role-modal").classList.add("hidden"); };
window.saveRole = async function() {
  const uid  = document.getElementById("r-uid").value;
  const role = document.getElementById("r-role").value || null;
  const r = await adminApi(`/users/${uid}/role`, { method: "PUT", body: { role } });
  if (r.ok) { toast("Role updated", "success"); closeRoleModal(); loadUsers(page); }
  else toast(r.data.error || "Failed", "error");
};

await loadUsers(1);
</script>
</body>
</html>
