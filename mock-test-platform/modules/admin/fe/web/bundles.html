<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Bundles</title>
<link rel="stylesheet" href="../shared/admin.css">
</head>
<body>
<script type="module">
import { initAdminShell, adminApi, toast } from "../shared/admin-shell.js";
await initAdminShell({ title: "Question Bundles" });

const pageBody = document.getElementById("page-body");
pageBody.innerHTML = `
  <p style="font-size:13px;color:#555;margin-bottom:20px">
    Bundles are pre-built JSON files stored in R2. When you publish an exam, the bundle is built automatically.
    Use "Force Rebuild" to regenerate a bundle after editing questions.
  </p>
  <div class="card">
    <div class="card-header">Bundle Status
      <button class="btn btn-secondary btn-sm" onclick="loadBundles()">↺ Refresh</button>
    </div>
    <div class="card-body" style="padding:0">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Exam ID</th><th>Title</th><th>Bundle Status</th><th>Last Built</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="bundles-tbody"><tr><td colspan="5" class="loading-row"><div class="spin"></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>`;

window.loadBundles = async function() {
  const tbody = document.getElementById("bundles-tbody");
  tbody.innerHTML = `<tr><td colspan="5" class="loading-row"><div class="spin"></div></td></tr>`;
  const r = await adminApi("/bundles");
  if (!r.ok) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:#888">Failed to load</td></tr>`; return; }
  const bundles = r.data.bundles || [];
  if (!bundles.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">No exams configured</div></div></td></tr>`;
    return;
  }
  const _fmt = ts => ts ? new Date(ts).toLocaleString() : "Never";
  tbody.innerHTML = bundles.map(b => `
    <tr>
      <td><code style="font-size:11px">${b.exam_id}</code></td>
      <td style="font-weight:600">${b.title || "—"}</td>
      <td><span class="badge ${b.has_bundle ? "badge-green" : "badge-red"}">${b.has_bundle ? "✓ Ready" : "✗ Missing"}</span></td>
      <td style="font-size:12px;color:#888">${_fmt(b.uploaded)}</td>
      <td class="td-actions">
        <button class="btn btn-warning btn-xs" onclick="rebuild('${b.exam_id}','${(b.title||'').replace(/'/g,"\\'")}')">Force Rebuild</button>
      </td>
    </tr>`).join("");
};

window.rebuild = async function(examId, title) {
  if (!confirm(`Rebuild bundle for "${title}"? This re-reads all question_ids from the exam config.`)) return;
  const btn = event.target;
  btn.disabled = true; btn.textContent = "Building…";
  const r = await adminApi(`/bundles/${examId}/rebuild`, { method: "POST" });
  btn.disabled = false; btn.textContent = "Force Rebuild";
  if (r.ok) { toast(`Bundle rebuilt: ${r.data.total_qs} questions`, "success"); loadBundles(); }
  else toast(r.data.error || "Rebuild failed", "error");
};

await loadBundles();
</script>
</body>
</html>
