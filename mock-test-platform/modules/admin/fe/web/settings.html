<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Settings</title>
<link rel="stylesheet" href="../shared/admin.css">
</head>
<body>
<script type="module">
import { initAdminShell, adminApi, toast } from "../shared/admin-shell.js";
await initAdminShell({ title: "Tenant Settings" });
document.getElementById("topbar-actions").innerHTML = `<button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>`;

const pageBody = document.getElementById("page-body");
pageBody.innerHTML = `
  <div style="max-width:700px">
    <div class="card" style="margin-bottom:20px">
      <div class="card-header">General</div>
      <div class="card-body">
        <div class="form-group"><label class="form-label">Tenant Name</label><input id="s-name" class="form-control" placeholder="My Test Prep Platform"></div>
        <div class="form-group"><label class="form-label">Tenant ID</label><input id="s-tenant-id" class="form-control" readonly></div>
        <div class="form-group"><label class="form-label">Contact Email</label><input id="s-email" class="form-control" type="email" placeholder="admin@example.com"></div>
        <div class="form-group"><label class="form-label">Logo URL</label><input id="s-logo" class="form-control" placeholder="https://…/logo.png"></div>
        <div class="form-group"><label class="form-label">Brand Color</label><input id="s-color" class="form-control" type="color" value="#1565c0" style="height:40px;padding:4px 6px"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:20px">
      <div class="card-header">Exam Defaults</div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group"><label class="form-label">Default Duration (s)</label><input id="s-default-duration" class="form-control" type="number" placeholder="3600"></div>
          <div class="form-group"><label class="form-label">Session TTL (s)</label><input id="s-session-ttl" class="form-control" type="number" placeholder="172800"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Correct Marks Default</label><input id="s-correct" class="form-control" type="number" step="0.01" placeholder="1"></div>
          <div class="form-group"><label class="form-label">Wrong Marks Default</label><input id="s-wrong" class="form-control" type="number" step="0.001" placeholder="-0.333"></div>
        </div>
        <div style="display:flex;gap:20px">
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input id="s-shuffle-qs" type="checkbox"> Shuffle questions by default</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input id="s-shuffle-opts" type="checkbox"> Shuffle options by default</label>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header">Modules</div>
      <div class="card-body">
        <div class="form-group"><label class="form-label">Enabled Modules (comma-separated IDs)</label><input id="s-modules" class="form-control" placeholder="exam-engine"></div>
        <div class="form-group"><label class="form-label">Tier</label>
          <select id="s-tier" class="form-control"><option value="free">Free</option><option value="starter">Starter</option><option value="pro">Pro</option><option value="enterprise">Enterprise</option></select>
        </div>
      </div>
    </div>
  </div>`;

const r = await adminApi("/settings");
if (r.ok) {
  const s = r.data.settings;
  document.getElementById("s-name").value = s.name || "";
  document.getElementById("s-tenant-id").value = s.tenant_id || "";
  document.getElementById("s-email").value = s.email || "";
  document.getElementById("s-logo").value = s.logo || "";
  document.getElementById("s-color").value = s.brand_color || "#1565c0";
  document.getElementById("s-default-duration").value = s.default_duration || "";
  document.getElementById("s-session-ttl").value = s.session_ttl || "";
  document.getElementById("s-correct").value = s.default_correct || "";
  document.getElementById("s-wrong").value = s.default_wrong || "";
  document.getElementById("s-shuffle-qs").checked = s.shuffle_qs !== false;
  document.getElementById("s-shuffle-opts").checked = s.shuffle_opts !== false;
  document.getElementById("s-modules").value = (s.modules || []).join(", ");
  document.getElementById("s-tier").value = s.tier || "free";
}

window.saveSettings = async function() {
  const body = {
    name:             document.getElementById("s-name").value.trim(),
    email:            document.getElementById("s-email").value.trim(),
    logo:             document.getElementById("s-logo").value.trim(),
    brand_color:      document.getElementById("s-color").value,
    default_duration: parseInt(document.getElementById("s-default-duration").value) || null,
    session_ttl:      parseInt(document.getElementById("s-session-ttl").value) || null,
    default_correct:  parseFloat(document.getElementById("s-correct").value) || null,
    default_wrong:    parseFloat(document.getElementById("s-wrong").value) || null,
    shuffle_qs:       document.getElementById("s-shuffle-qs").checked,
    shuffle_opts:     document.getElementById("s-shuffle-opts").checked,
    modules:          document.getElementById("s-modules").value.split(",").map(s=>s.trim()).filter(Boolean),
    tier:             document.getElementById("s-tier").value,
  };
  const res = await adminApi("/settings", { method: "PUT", body });
  if (res.ok) toast("Settings saved", "success");
  else toast(res.data.error || "Save failed", "error");
};
</script>
</body>
</html>
