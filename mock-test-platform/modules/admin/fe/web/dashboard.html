<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin — Dashboard</title>
<script src="./admin-common.js"></script>
</head>
<body>
<div class="admin-wrap">
  <aside id="admin-sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-title">Dashboard</div>
      <div class="topbar-right">
        <span id="live-clock" style="font-size:13px;color:#64748b;font-variant-numeric:tabular-nums;"></span>
      </div>
    </header>
    <div class="page-content">

      <!-- Stat Cards -->
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-icon">🏢</div>
          <div class="stat-num" id="s-tenants">—</div>
          <div class="stat-lbl">Tenants</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-num" id="s-users">—</div>
          <div class="stat-lbl">Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">❓</div>
          <div class="stat-num" id="s-questions">—</div>
          <div class="stat-lbl">Questions</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div class="stat-num" id="s-exams">—</div>
          <div class="stat-lbl">Exams</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📈</div>
          <div class="stat-num" id="s-sessions">—</div>
          <div class="stat-lbl">Sessions</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-num" id="s-completed">—</div>
          <div class="stat-lbl">Completed</div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

        <!-- Tenants Table -->
        <div>
          <div class="section-header">
            <div class="section-title-text">Tenants</div>
            <a href="tenants.html" class="btn btn-ghost btn-sm">Manage →</a>
          </div>
          <div class="table-card">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Tenant</th>
                  <th>Users</th>
                  <th>Exams</th>
                  <th>Modules</th>
                </tr>
              </thead>
              <tbody id="tenants-tbody">
                <tr><td colspan="4" class="empty-row">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Recent Sessions Table -->
        <div>
          <div class="section-header">
            <div class="section-title-text">Recent Sessions</div>
            <a href="sessions.html" class="btn btn-ghost btn-sm">View All →</a>
          </div>
          <div class="table-card">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Session ID</th>
                  <th>Tenant</th>
                  <th>Status</th>
                  <th>Started</th>
                </tr>
              </thead>
              <tbody id="sessions-tbody">
                <tr><td colspan="4" class="empty-row">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(typeof ts === "number" && ts < 1e12 ? ts * 1000 : ts);
  if (isNaN(d)) return "—";
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dd = String(d.getDate()).padStart(2, "0");
  const mon = months[d.getMonth()];
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${dd} ${mon} ${hh}:${mm}`;
}

function statusBadge(s) {
  const map = {
    completed: "bg-green", submitted: "bg-green",
    active: "bg-blue", started: "bg-blue",
    abandoned: "bg-red",
    pending: "bg-orange"
  };
  return `<span class="badge ${map[s] || "bg-gray"}">${s || "—"}</span>`;
}

async function loadStats() {
  const r = await api.get("/superadmin/stats");
  if (!r.ok) { toast("Failed to load stats", "error"); return; }
  const s = r.data;
  document.getElementById("s-tenants").textContent   = s.tenants   ?? "—";
  document.getElementById("s-users").textContent     = s.users     ?? "—";
  document.getElementById("s-questions").textContent = s.questions ?? "—";
  document.getElementById("s-exams").textContent     = s.exams     ?? "—";
  document.getElementById("s-sessions").textContent  = s.sessions  ?? "—";
  document.getElementById("s-completed").textContent = s.completed ?? "—";
}

async function loadTenants() {
  const r = await api.get("/superadmin/tenants");
  if (!r.ok) { toast("Failed to load tenants", "error"); return; }
  const tenants = r.data.tenants || [];
  const tbody = document.getElementById("tenants-tbody");
  if (!tenants.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty-row">No tenants found</td></tr>`;
    return;
  }
  tbody.innerHTML = tenants.map(t => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:20px;line-height:1;">${t.logo_emoji || "🏢"}</span>
          <div>
            <div style="font-weight:600;font-size:13px;">${t.name}</div>
            <div style="font-size:11px;color:#94a3b8;">${t.id}</div>
          </div>
        </div>
      </td>
      <td><span class="badge bg-blue">${t.user_count ?? 0}</span></td>
      <td><span class="badge bg-green">${t.exam_count ?? 0}</span></td>
      <td><span class="badge bg-gray">${Array.isArray(t.modules) ? t.modules.length : 0}</span></td>
    </tr>
  `).join("");
}

async function loadSessions() {
  const r = await api.get("/superadmin/sessions?limit=8");
  if (!r.ok) { toast("Failed to load sessions", "error"); return; }
  const sessions = r.data.sessions || [];
  const tbody = document.getElementById("sessions-tbody");
  if (!sessions.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty-row">No sessions found</td></tr>`;
    return;
  }
  tbody.innerHTML = sessions.map(s => `
    <tr>
      <td>
        <span style="font-family:monospace;font-size:11px;color:#64748b;" title="${s.id || ""}">
          ${s.id ? s.id.slice(0, 12) + "…" : "—"}
        </span>
      </td>
      <td><span class="badge bg-gray">${s.tenant_id || "—"}</span></td>
      <td>${statusBadge(s.status)}</td>
      <td style="font-size:12px;color:#64748b;">${fmtDate(s.started_at)}</td>
    </tr>
  `).join("");
}

function startClock() {
  const el = document.getElementById("live-clock");
  const DAYS   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function tick() {
    const now = new Date();
    const day = DAYS[now.getDay()];
    const d   = String(now.getDate()).padStart(2, "0");
    const mon = MONTHS[now.getMonth()];
    const hh  = String(now.getHours()).padStart(2, "0");
    const mm  = String(now.getMinutes()).padStart(2, "0");
    const ss  = String(now.getSeconds()).padStart(2, "0");
    el.textContent = `${day}, ${d} ${mon}  ${hh}:${mm}:${ss}`;
  }
  tick();
  setInterval(tick, 1000);
}

document.addEventListener("DOMContentLoaded", () => {
  startClock();
  loadStats();
  loadTenants();
  loadSessions();
});
</script>
</body>
</html>
