<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/modules/auth/fe/shared/base.css">
<style>
  body { background:#f0f2f7; font-family:system-ui,sans-serif; margin:0; }
  .avatar { width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#fff;flex-shrink:0; }
  input:focus { outline:2px solid #1a237e; }
  .toast { position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a237e;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;display:none; }
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<script>
const API = (window._API_PREFIX || "/user");
const token = localStorage.getItem("auth_token");
if (!token) { location.href = "/modules/auth/fe/web/login.html"; }

let profile = {};

async function api(method, path, body) {
  const r = await fetch(API + path, {
    method,
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  if (r.status === 401) { localStorage.clear(); location.href = "/modules/auth/fe/web/login.html"; }
  return r.json();
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

async function init() {
  profile = await api("GET", "/me");
  render();
}

function render() {
  const color = profile.avatar_color || "#1a237e";
  const initial = (profile.display_name || profile.phone || "?")[0].toUpperCase();
  document.getElementById("avatar").style.background = color;
  document.getElementById("avatar-letter").textContent = initial;
  document.getElementById("display-name").value = profile.display_name || "";
  document.getElementById("phone-val").textContent = profile.phone ? "+91 " + profile.phone : "—";
  document.getElementById("joined-val").textContent = profile.joined_at
    ? new Date(profile.joined_at).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" }) : "—";
  // Sub badge
  const sub = profile.subscription;
  document.getElementById("sub-badge").textContent = sub?.active ? (sub.plan || "Active") : "No plan";
  document.getElementById("sub-badge").className = "text-xs font-bold px-2 py-0.5 rounded-full " +
    (sub?.active ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-500");
}

async function save() {
  const name = document.getElementById("display-name").value.trim();
  if (!name) { showToast("Name cannot be empty"); return; }
  const res = await api("PUT", "/me", { display_name: name });
  if (res.ok) { profile.display_name = name; render(); showToast("Profile updated"); }
}

function logout() {
  localStorage.clear();
  location.href = "/modules/auth/fe/web/login.html";
}

init();
</script>

<!-- ── Nav ── -->
<nav class="bg-[#1a237e] text-white px-4 py-3 flex items-center gap-3">
  <span class="text-lg font-black">👤 My Account</span>
  <div class="ml-auto flex gap-3 text-sm font-semibold">
    <a href="history.html"   class="opacity-70 hover:opacity-100">History</a>
    <a href="analytics.html" class="opacity-70 hover:opacity-100">Analytics</a>
    <a href="subscription.html" class="opacity-70 hover:opacity-100">Plan</a>
  </div>
  <button onclick="logout()" class="ml-4 text-xs border border-white/40 px-3 py-1 rounded-lg opacity-70 hover:opacity-100">Logout</button>
</nav>

<div class="max-w-lg mx-auto p-4 space-y-4">

  <!-- Avatar + name card -->
  <div class="bg-white rounded-2xl p-6 shadow-sm flex items-center gap-5">
    <div class="avatar" id="avatar" style="background:#1a237e">
      <span id="avatar-letter">?</span>
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-lg font-black text-[#1a2a4a]" id="disp-name-label">Profile</span>
        <span id="sub-badge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">—</span>
      </div>
      <p id="phone-val" class="text-sm text-[#5c6b8a]">—</p>
    </div>
  </div>

  <!-- Edit profile -->
  <div class="bg-white rounded-2xl p-5 shadow-sm space-y-4">
    <p class="text-xs font-black uppercase tracking-widest text-[#5c6b8a]">Edit Profile</p>
    <div>
      <label class="text-xs font-bold text-[#1a2a4a] block mb-1">Display Name</label>
      <input id="display-name" type="text" maxlength="60" placeholder="Your name"
        class="w-full border border-[#c0c8d8] rounded-xl px-4 py-3 text-sm text-[#1a2a4a]" />
    </div>
    <button onclick="save()" class="w-full bg-[#1a237e] text-white rounded-xl py-3 text-sm font-black">Save Changes</button>
  </div>

  <!-- Details -->
  <div class="bg-white rounded-2xl p-5 shadow-sm space-y-3">
    <p class="text-xs font-black uppercase tracking-widest text-[#5c6b8a]">Account Details</p>
    <div class="flex justify-between text-sm">
      <span class="text-[#5c6b8a] font-semibold">Phone</span>
      <span id="phone-val" class="font-bold text-[#1a2a4a]">—</span>
    </div>
    <div class="flex justify-between text-sm">
      <span class="text-[#5c6b8a] font-semibold">Member since</span>
      <span id="joined-val" class="font-bold text-[#1a2a4a]">—</span>
    </div>
  </div>

  <!-- Quick links -->
  <div class="grid grid-cols-3 gap-3">
    <a href="history.html"   class="bg-white rounded-xl p-4 text-center shadow-sm hover:shadow-md transition">
      <div class="text-2xl mb-1">📋</div><div class="text-xs font-black text-[#1a2a4a]">History</div>
    </a>
    <a href="analytics.html" class="bg-white rounded-xl p-4 text-center shadow-sm hover:shadow-md transition">
      <div class="text-2xl mb-1">📊</div><div class="text-xs font-black text-[#1a2a4a]">Analytics</div>
    </a>
    <a href="subscription.html" class="bg-white rounded-xl p-4 text-center shadow-sm hover:shadow-md transition">
      <div class="text-2xl mb-1">🎟️</div><div class="text-xs font-black text-[#1a2a4a]">My Plan</div>
    </a>
  </div>

</div>
</body>
</html>
