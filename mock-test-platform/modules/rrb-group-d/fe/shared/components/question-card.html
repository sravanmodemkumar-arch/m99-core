<!-- Question card fragment — loaded via hx-get="/rrb/question?id={qId}" -->
<!-- Server returns only this fragment; JS replaces #question-area -->
<div class="question-card" id="qcard-{{id}}">
  <div class="q-meta">Question {{index}} of {{total}}{{#section}} &mdash; {{section}}{{/section}}</div>
  <div class="q-text">{{text}}</div>
  {{#image}}<img class="q-image" src="{{image}}" alt="">{{/image}}
  <div class="options-list" id="options-{{id}}">
    {{#options}}
    <label class="option-row{{#selected}} selected{{/selected}}" data-key="{{key}}" onclick="__selectOption('{{qid}}','{{key}}')">
      <span class="opt-key">{{key}}</span>
      <span class="opt-body">{{#oImage}}<img class="opt-image" src="{{oImage}}" alt="">{{/oImage}}{{text}}</span>
      <span class="opt-check"></span>
    </label>
    {{/options}}
  </div>
</div>
