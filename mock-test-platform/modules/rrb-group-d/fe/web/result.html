<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRB Group D — Result</title>
<link rel="stylesheet" href="../../auth/fe/shared/base.css">
<link rel="stylesheet" href="../fe/shared/exam.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3/dist/tailwind.min.css">
<style>
  .page-wrap { max-width: 720px; margin: 0 auto; padding: 1.25rem; }
  .page-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .section-breakdown { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-top: 1.25rem; }
  .section-row { display: grid; grid-template-columns: 1fr repeat(4, auto); align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
  .section-row:last-child { border-bottom: none; }
  .section-row-head { font-weight: 700; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; background: var(--surface-2); }
  .section-name { font-weight: 600; }
  .cell-correct { color: #16A34A; font-weight: 700; }
  .cell-wrong   { color: #DC2626; font-weight: 700; }
  .cell-skip    { color: var(--text-muted); }
  .cell-score   { font-weight: 800; color: var(--primary); }
  .answer-key-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  .answer-key-table th, .answer-key-table td { padding: 0.5rem 0.625rem; border: 1px solid var(--border); text-align: center; }
  .answer-key-table th { background: var(--surface-2); font-weight: 700; }
  .verdict-correct { color: #16A34A; font-weight: 700; }
  .verdict-wrong   { color: #DC2626; font-weight: 700; }
  .verdict-skip    { color: var(--text-muted); }
  .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .filter-chip { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8125rem; border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; }
  .filter-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  @media (max-width: 599px) {
    .section-row { grid-template-columns: 1fr repeat(4, auto); gap: 0.5rem; font-size: 0.8125rem; }
  }
</style>
<script src="../desktop/desktop-adapter.js"></script>
</head>
<body>
<div style="background:var(--bg);min-height:100vh">
<div class="page-wrap">

  <!-- Header -->
  <div class="page-header">
    <a href="home.html" class="btn btn-outline btn-sm">← Home</a>
    <div>
      <div style="font-size:1.0625rem;font-weight:800;color:var(--text)">RRB Group D — Result</div>
      <div style="font-size:0.8125rem;color:var(--text-muted)" id="result-meta"></div>
    </div>
  </div>

  <!-- Score card -->
  <div class="result-card" id="result-card"></div>

  <!-- Section breakdown -->
  <div style="margin-top:1.5rem">
    <div style="font-size:0.9375rem;font-weight:700;margin-bottom:0.75rem;color:var(--text)">Section Breakdown</div>
    <div class="section-breakdown" id="section-breakdown"></div>
  </div>

  <!-- Answer key review -->
  <div style="margin-top:1.5rem">
    <div style="font-size:0.9375rem;font-weight:700;margin-bottom:0.75rem;color:var(--text)">Answer Review</div>
    <div class="filter-bar">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="filter-chip" data-filter="correct" onclick="setFilter('correct',this)">Correct</button>
      <button class="filter-chip" data-filter="wrong" onclick="setFilter('wrong',this)">Wrong</button>
      <button class="filter-chip" data-filter="skipped" onclick="setFilter('skipped',this)">Skipped</button>
    </div>
    <div style="overflow-x:auto">
      <table class="answer-key-table" id="answer-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Section</th>
            <th>Your Answer</th>
            <th>Correct</th>
            <th>Verdict</th>
            <th>Marks</th>
          </tr>
        </thead>
        <tbody id="answer-tbody"></tbody>
      </table>
    </div>
  </div>

</div>
</div>

<script type="module">
import { boot, requireAuth } from "../../auth/fe/web/app.js";
import { renderResultCard } from "../fe/shared/components.js";
import { formatScore } from "../fe/shared/scoring.js";

let allRows = [];
let activeFilter = "all";

async function init() {
  if (!requireAuth()) return;
  await boot();

  const params   = new URLSearchParams(location.search);
  const sessionId = params.get("session_id");
  const score     = parseFloat(params.get("score") || "0");
  const correct   = parseInt(params.get("correct")  || "0");
  const wrong     = parseInt(params.get("wrong")    || "0");
  const skipped   = parseInt(params.get("skipped")  || "0");
  const total     = parseInt(params.get("total")    || "100");
  const pct       = parseFloat(params.get("pct")    || "0");

  document.getElementById("result-meta").textContent =
    `Session: ${sessionId || "—"}`;

  // Result card
  document.getElementById("result-card").innerHTML = renderResultCard({
    score, correct, wrong, skipped, total, percentage: pct,
  });
  // Patch links inside result card
  document.querySelector(".result-card a[href='./analysis.html']")?.setAttribute("href", `analysis.html?session_id=${sessionId}`);

  // Load detailed data from sessionStorage
  const stored = sessionStorage.getItem(`result_${sessionId}`);
  if (!stored) { renderSectionBreakdown(null); renderAnswerTable([], null); return; }
  const data = JSON.parse(stored);

  renderSectionBreakdown(data.sections);
  buildAnswerRows(data.answer_key, data.responses, data.sections);
  renderAnswerTable(allRows, "all");
}

function renderSectionBreakdown(sections) {
  const el = document.getElementById("section-breakdown");
  if (!sections) { el.innerHTML = `<div style="padding:1rem;color:var(--text-muted);text-align:center">No section data</div>`; return; }

  const sectionDefs = [
    { id: "math",      label: "Mathematics" },
    { id: "reasoning", label: "Reasoning" },
    { id: "science",   label: "General Science" },
    { id: "gk",        label: "General Awareness" },
  ];

  let html = `<div class="section-row section-row-head"><span>Section</span><span>Correct</span><span>Wrong</span><span>Skipped</span><span>Score</span></div>`;
  for (const s of sectionDefs) {
    const d = sections[s.id] || { correct: 0, wrong: 0, skipped: 0, rawScaled: 0 };
    html += `<div class="section-row">
      <span class="section-name">${s.label}</span>
      <span class="cell-correct">${d.correct}</span>
      <span class="cell-wrong">${d.wrong}</span>
      <span class="cell-skip">${d.skipped}</span>
      <span class="cell-score">${formatScore(d.rawScaled)}</span>
    </div>`;
  }
  el.innerHTML = html;
}

function buildAnswerRows(answerKey, responses, sections) {
  let idx = 0;
  allRows = Object.entries(answerKey).map(([qid, correct]) => {
    idx++;
    const r = responses[qid] || { chosen: null, attempted: false };
    const sectionId = Object.entries(sections || {}).find(([sid, s]) =>
      s.responses?.[qid]
    )?.[0] || "";
    let verdict = "skipped";
    if (r.attempted && r.chosen) {
      verdict = r.chosen === correct ? "correct" : "wrong";
    }
    const marks = verdict === "correct" ? "+1" : verdict === "wrong" ? "−1/3" : "0";
    return { idx, qid, sectionId, chosen: r.chosen || "—", correct, verdict, marks };
  });
}

function renderAnswerTable(rows, filter) {
  const filtered = filter === "all" ? rows : rows.filter(r => r.verdict === filter);
  const sectionLabels = { math: "Math", reasoning: "Reasoning", science: "Science", gk: "GK" };
  document.getElementById("answer-tbody").innerHTML = filtered.map(r => `
    <tr>
      <td>${r.idx}</td>
      <td>${sectionLabels[r.sectionId] || r.sectionId}</td>
      <td>${r.chosen}</td>
      <td>${r.correct}</td>
      <td class="verdict-${r.verdict}">${r.verdict === "correct" ? "✓ Correct" : r.verdict === "wrong" ? "✗ Wrong" : "— Skipped"}</td>
      <td>${r.marks}</td>
    </tr>`).join("");
}

window.setFilter = function(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  renderAnswerTable(allRows, filter);
};

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
