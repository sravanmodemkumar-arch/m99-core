<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRB Group D — Exam</title>
<link rel="stylesheet" href="../../auth/fe/shared/base.css">
<link rel="stylesheet" href="../fe/shared/exam.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3/dist/tailwind.min.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); }
  /* Exam shell */
  .exam-shell { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  /* Mobile: single column, bottom action bar */
  .exam-body { display: grid; grid-template-columns: 1fr; overflow: hidden; }
  /* Tablet (≥768): sidebar visible */
  @media (min-width: 768px) {
    .exam-body { grid-template-columns: 1fr 260px; }
    .sidebar-col { display: flex !important; flex-direction: column; overflow-y: auto; border-left: 1px solid var(--border); background: var(--surface); }
    .mobile-palette-btn { display: none !important; }
  }
  /* Desktop (≥1024): wider sidebar */
  @media (min-width: 1024px) {
    .exam-body { grid-template-columns: 1fr 300px; }
  }
  .main-col { display: flex; flex-direction: column; overflow: hidden; }
  .main-scroll { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }
  .sidebar-col { display: none; padding: 0.75rem; }

  /* Palette drawer on mobile */
  .palette-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
  .palette-drawer-wrap { position: fixed; bottom: 0; left: 0; right: 0; z-index: 91; background: var(--surface); border-radius: 1rem 1rem 0 0; padding: 1rem; max-height: 72vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease; }
  .palette-backdrop.open { display: block; }
  .palette-drawer-wrap.open { transform: translateY(0); }
  .drawer-handle { width: 2.5rem; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 1rem; }

  /* Submit bar */
  .action-bar { padding: 0.75rem 1rem; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 0.5rem; flex-shrink: 0; }

  /* Loading */
  #loading-wrap { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 200; flex-direction: column; gap: 1rem; }
  .spin { width: 2.5rem; height: 2.5rem; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Submit modal overlay */
  #submit-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
  #submit-overlay.open { display: flex; }
  .submit-modal { background: var(--surface); border-radius: 1rem; padding: 1.5rem; width: 90%; max-width: 400px; }
  .submit-modal-title { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; }
  .submit-modal-sub { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.25rem; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-wrap">
  <div class="spin"></div>
  <div style="color:var(--text-muted);font-size:0.9rem">Loading exam…</div>
</div>

<!-- Exam shell -->
<div class="exam-shell" id="exam-shell" style="display:none">

  <!-- Header -->
  <div class="exam-header" id="exam-header">
    <div style="display:flex;align-items:center;gap:0.5rem;min-width:0">
      <div class="exam-title" id="exam-title">RRB Group D</div>
      <div class="exam-candidate" id="exam-candidate"></div>
    </div>
    <div style="display:flex;align-items:center;gap:0.75rem;flex-shrink:0">
      <button class="btn btn-sm btn-outline mobile-palette-btn" id="mobile-palette-btn" style="font-size:0.8125rem">Questions</button>
      <div class="exam-timer" id="exam-timer">00:00:00</div>
    </div>
  </div>

  <!-- Section tabs -->
  <div class="section-tabs" id="section-tabs"></div>

  <!-- Body -->
  <div class="exam-body">
    <!-- Main: question + action -->
    <div class="main-col">
      <div class="main-scroll" id="main-scroll">
        <div id="question-area"></div>
      </div>
      <div class="action-bar" id="action-bar"></div>
    </div>

    <!-- Sidebar palette (tablet+) -->
    <div class="sidebar-col" id="sidebar-col">
      <div class="palette-panel" id="sidebar-palette"></div>
    </div>
  </div>
</div>

<!-- Mobile palette drawer -->
<div class="palette-backdrop" id="palette-backdrop" onclick="closePalette()"></div>
<div class="palette-drawer-wrap" id="palette-drawer">
  <div class="drawer-handle"></div>
  <div class="palette-panel" id="drawer-palette"></div>
</div>

<!-- Submit confirmation modal -->
<div id="submit-overlay">
  <div class="submit-modal">
    <div class="submit-modal-title">Submit Exam?</div>
    <div class="submit-modal-sub">You cannot change answers after submission.</div>
    <div id="modal-summary"></div>
    <div style="display:flex;gap:0.75rem;margin-top:1.25rem">
      <button class="btn btn-outline" style="flex:1" onclick="closeSubmitModal()">Go Back</button>
      <button class="btn btn-primary" style="flex:1" id="confirm-submit-btn" onclick="confirmSubmit()">Submit Now</button>
    </div>
  </div>
</div>

<script type="module">
import { boot, requireAuth, api } from "../../auth/fe/web/app.js";
import {
  renderQuestion, renderPaletteSection, renderActionBar,
  renderSectionTabs, renderSubmitSummary, renderExamSkeleton,
} from "../fe/shared/components.js";
import {
  initState, goTo, selectOption, clearOption, toggleMark,
  tick, summary, buildResponses, serialize, deserialize, Q,
} from "../fe/shared/qstate.js";
import { scoreExam, formatScore, percentage } from "../fe/shared/scoring.js";

// ── State ──────────────────────────────────────────────────────────────────
let state      = null;
let bundle     = null;   // client bundle from R2
let sessionId  = null;
let timerHandle = null;
let syncHandle  = null;
let activeSectionId = null;

// ── Boot ───────────────────────────────────────────────────────────────────
async function init() {
  if (!requireAuth()) return;
  const cfg = await boot();
  document.getElementById("exam-candidate").textContent =
    localStorage.getItem("name") || "";

  // Start exam — get session + bundle URL
  const params = new URLSearchParams(location.search);
  const examId = params.get("exam_id") || "rrb-gd-2024";

  const { ok, data } = await api("/rrb/exam/start", {
    method: "POST",
    body: JSON.stringify({ exam_id: examId }),
  });
  if (!ok) { alert(data.error || "Failed to start exam"); return; }

  sessionId = data.session_id;

  // Fetch bundle
  const bundleRes = await fetch(data.bundle_url, {
    headers: { Authorization: `Bearer ${localStorage.getItem("auth_token")}` },
  });
  bundle = await bundleRes.json();

  // Restore checkpoint if resuming
  if (data.resumed && data.checkpoint && Object.keys(data.checkpoint).length > 0) {
    state = deserialize(localStorage.getItem(`checkpoint_${sessionId}`) || "{}");
    if (!state?.order) state = initState(bundle.questions);
    // Replay server checkpoint responses
    for (const [qid, r] of Object.entries(data.checkpoint)) {
      if (r.chosen && r.attempted) {
        state = selectOption(state, qid, r.chosen);
      }
    }
  } else {
    state = initState(bundle.questions);
  }

  // Navigate to first question
  activeSectionId = bundle.sections[0]?.id;
  state = goTo(state, state.order[0]);

  // Render shell
  document.getElementById("loading-wrap").style.display = "none";
  document.getElementById("exam-shell").style.display   = "";

  renderSectionTabsBar();
  renderCurrentQuestion();
  renderAllPalettes();

  // Start timer
  const elapsed = data.elapsed_s || 0;
  startTimer(bundle.duration_s, elapsed);

  // KV sync every 30s
  syncHandle = setInterval(pushSync, 30000);
}

// ── Timer ──────────────────────────────────────────────────────────────────
function startTimer(duration, elapsed) {
  state = { ...state, elapsed };
  timerHandle = setInterval(() => {
    state = tick(state);
    updateTimerDisplay();
    if (state.elapsed >= duration) {
      clearInterval(timerHandle);
      clearInterval(syncHandle);
      autoSubmit();
    }
  }, 1000);
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const remaining = Math.max(0, bundle.duration_s - state.elapsed);
  const warn = remaining < 300;
  const h = Math.floor(remaining / 3600);
  const m = Math.floor((remaining % 3600) / 60);
  const s = remaining % 60;
  const el = document.getElementById("exam-timer");
  el.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  el.classList.toggle("timer-warn", warn);
}

function pad(n) { return String(n).padStart(2, "0"); }

// ── Render ─────────────────────────────────────────────────────────────────
function renderCurrentQuestion() {
  const qId  = state.current;
  const qState = state.questions[qId];
  const qs   = bundle.questions;
  const idx  = state.order.indexOf(qId);
  const q    = qs.find(q => q.id === qId);

  document.getElementById("question-area").innerHTML = renderQuestion({
    id: qId, index: idx, total: state.order.length,
    text: q.text, image: q.image,
    options: q.options.map(o => ({ ...o, qid: qId })),
    chosen: qState.chosen,
  });

  renderActionBarHTML();
  renderAllPalettes();
}

function renderActionBarHTML() {
  const qId    = state.current;
  const qState = state.questions[qId];
  const idx    = state.order.indexOf(qId);
  const isLast = idx === state.order.length - 1;
  const isMarked = qState.status === Q.MARKED_REVIEW || qState.status === Q.ANSWERED_MARKED;
  document.getElementById("action-bar").innerHTML = renderActionBar({
    qId, isLast, isMarked, hasAnswer: !!qState.chosen,
  });
}

function renderSectionTabsBar() {
  const counts = summary(state);
  const sections = bundle.sections.map(s => ({
    id: s.id,
    label: s.label,
    answered: counts.sections[s.id]?.answered || 0,
    total: s.count,
  }));
  document.getElementById("section-tabs").innerHTML = renderSectionTabs(sections, activeSectionId);
}

function renderAllPalettes() {
  const paletteHTML = _buildPaletteHTML();
  document.getElementById("sidebar-palette").innerHTML = paletteHTML;
  document.getElementById("drawer-palette").innerHTML  = paletteHTML;
}

function _buildPaletteHTML() {
  const counts = summary(state);
  let html = "";
  for (const section of bundle.sections) {
    const sectionQs = state.order
      .map((id, i) => ({ ...state.questions[id], index: i }))
      .filter(q => q.section === section.id);
    html += renderPaletteSection(
      { id: section.id, label: section.label, questions: sectionQs },
      state.current
    );
  }
  html += `<div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--border)">
    <button class="btn btn-primary" style="width:100%" onclick="__submitExam()">Submit Exam</button>
  </div>`;
  return html;
}

// ── Global actions (called from renderActionBar/renderPaletteBtn onclick) ──
window.__goTo = (qId) => {
  state = goTo(state, qId);
  renderCurrentQuestion();
  const q = state.questions[qId];
  if (q?.section !== activeSectionId) {
    activeSectionId = q.section;
    renderSectionTabsBar();
  }
  closePalette();
};

window.__selectOption = (qId, option) => {
  state = selectOption(state, qId, option);
  renderCurrentQuestion();
};

window.__clearOption = (qId) => {
  state = clearOption(state, qId);
  renderCurrentQuestion();
};

window.__toggleMark = (qId) => {
  state = toggleMark(state, qId);
  renderCurrentQuestion();
};

window.__saveAndNext = (qId) => {
  const idx = state.order.indexOf(qId);
  if (idx < state.order.length - 1) {
    window.__goTo(state.order[idx + 1]);
  } else {
    window.__submitExam();
  }
};

window.__switchSection = (sectionId) => {
  activeSectionId = sectionId;
  // Navigate to first not-visited question in section, or first question
  const sectionQ = state.order.find(id => {
    const q = state.questions[id];
    return q.section === sectionId && q.status === Q.NOT_VISITED;
  }) || state.order.find(id => state.questions[id].section === sectionId);
  if (sectionQ) window.__goTo(sectionQ);
  renderSectionTabsBar();
};

window.__submitExam = () => {
  const counts = summary(state).total;
  document.getElementById("modal-summary").innerHTML = renderSubmitSummary(counts);
  document.getElementById("submit-overlay").classList.add("open");
};

// ── Mobile palette drawer ──────────────────────────────────────────────────
document.getElementById("mobile-palette-btn")?.addEventListener("click", openPalette);

window.openPalette = function() {
  document.getElementById("palette-backdrop").classList.add("open");
  document.getElementById("palette-drawer").classList.add("open");
};
window.closePalette = function() {
  document.getElementById("palette-backdrop").classList.remove("open");
  document.getElementById("palette-drawer").classList.remove("open");
};

// ── Submit ─────────────────────────────────────────────────────────────────
window.closeSubmitModal = function() {
  document.getElementById("submit-overlay").classList.remove("open");
};

window.confirmSubmit = async function() {
  const btn = document.getElementById("confirm-submit-btn");
  btn.disabled = true; btn.textContent = "Submitting…";

  clearInterval(timerHandle);
  clearInterval(syncHandle);

  const responses = {};
  for (const [id, q] of Object.entries(state.questions)) {
    responses[id] = { chosen: q.chosen, attempted: q.attempted };
  }

  const { ok, data } = await api("/rrb/exam/submit", {
    method: "POST",
    body: JSON.stringify({ session_id: sessionId, responses, elapsed_s: state.elapsed }),
  });

  if (!ok) {
    btn.disabled = false; btn.textContent = "Submit Now";
    alert(data.error || "Submission failed. Please try again.");
    return;
  }

  // Client-side scoring for instant display
  const sectionMap = {};
  for (const section of bundle.sections) {
    sectionMap[section.id] = bundle.questions
      .filter(q => q.section === section.id)
      .map(q => ({
        chosen:    state.questions[q.id]?.chosen || null,
        correct:   data.answer_key[q.id],
        attempted: state.questions[q.id]?.attempted || false,
      }));
  }

  const result = scoreExam(sectionMap);
  const params = new URLSearchParams({
    session_id: sessionId,
    score:      result.total.score,
    correct:    result.total.correct,
    wrong:      result.total.wrong,
    skipped:    result.total.skipped,
    total:      bundle.questions.length,
    pct:        percentage(result.total.rawScaled, bundle.questions.length),
  });

  // Pass answer key via sessionStorage for result page
  sessionStorage.setItem(`result_${sessionId}`, JSON.stringify({
    answer_key: data.answer_key,
    responses,
    sections: result.sections,
    ...result.total,
  }));

  window.location.href = `result.html?${params}`;
};

async function autoSubmit() {
  // Time expired — auto-submit with current state
  if (document.getElementById("confirm-submit-btn")) {
    window.confirmSubmit();
  }
}

// ── KV sync ────────────────────────────────────────────────────────────────
async function pushSync() {
  if (!sessionId || !state) return;
  const responses = {};
  for (const [id, q] of Object.entries(state.questions)) {
    if (q.attempted) responses[id] = { chosen: q.chosen, attempted: true };
  }
  // Save local checkpoint too
  localStorage.setItem(`checkpoint_${sessionId}`, serialize(state));
  // Fire-and-forget
  fetch("/rrb/exam/sync", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${localStorage.getItem("auth_token")}` },
    body: JSON.stringify({ session_id: sessionId, elapsed_s: state.elapsed, responses }),
  }).catch(() => {});
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
