name = "mtp-rrb-group-d"
main = "backend/worker.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_RRB_GD_KV_ID"
preview_id = "REPLACE_WITH_RRB_GD_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "R2"
bucket_name = "mtp-exam-data"
preview_bucket_name = "mtp-exam-data-preview"

[vars]
# JWT_SECRET set via: wrangler secret put JWT_SECRET
