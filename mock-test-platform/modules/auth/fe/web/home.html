<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; background: #f0f4f8; }

/* ── Header ──────────────────────────────────────────── */
.header {
  background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
  color: #fff; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,.2);
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 58px;
}
.header-brand { display: flex; align-items: center; gap: 10px; }
.brand-logo  { font-size: 24px; }
.brand-name  { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.brand-sub   { font-size: 11px; opacity: .75; }
.header-right { display: flex; align-items: center; gap: 10px; }
.hdr-username { font-size: 13px; opacity: .9; }
.hdr-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; overflow: hidden;
}
.btn-logout {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; border-radius: 6px; padding: 5px 12px;
  font-size: 12px; cursor: pointer; transition: background .15s;
}
.btn-logout:hover { background: rgba(255,255,255,.28); }

/* ── Hero ────────────────────────────────────────────── */
.hero {
  background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
  padding: 24px 20px 36px; color: #fff;
}
.hero-inner { max-width: 1100px; margin: 0 auto; }
.hero-greet { font-size: 13px; opacity: .8; margin-bottom: 4px; }
.hero-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.hero-sub   { font-size: 13px; opacity: .75; }

/* ── Content ─────────────────────────────────────────── */
.content { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

.sec-title {
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  letter-spacing: .06em; color: #546e7a; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.sec-title::after { content: ""; display: block; width: 36px; height: 2px; background: #1565c0; border-radius: 2px; }

/* ── Module cards ────────────────────────────────────── */
.modules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-bottom: 36px; }

.module-card {
  background: #fff; border-radius: 14px;
  border: 1.5px solid #e3e8f0;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
  padding: 22px; cursor: pointer;
  transition: box-shadow .2s, transform .15s, border-color .15s;
  display: flex; flex-direction: column; gap: 10px;
}
.module-card:hover { box-shadow: 0 8px 24px rgba(21,101,192,.13); transform: translateY(-2px); border-color: #1565c0; }
.module-card:focus { outline: 2px solid #1565c0; outline-offset: 2px; }

.module-icon-row { display: flex; align-items: center; justify-content: space-between; }
.module-icon { font-size: 36px; }
.module-arrow { font-size: 18px; color: #b0bec5; transition: color .15s; }
.module-card:hover .module-arrow { color: #1565c0; }

.module-name { font-size: 16px; font-weight: 700; color: #1a237e; }
.module-desc { font-size: 12px; color: #78909c; line-height: 1.5; }

.module-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.module-badge {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
  background: #e8eaf6; color: #283593;
}
.module-cta { font-size: 12px; font-weight: 700; color: #1565c0; }

/* ── Quick stats row ──────────────────────────────────── */
.stats-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 32px; }
.stat-card {
  flex: 1; min-width: 140px;
  background: #fff; border-radius: 12px; border: 1.5px solid #e3e8f0;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;
}
.stat-label { font-size: 11px; color: #90a4ae; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.stat-value { font-size: 24px; font-weight: 800; color: #1a237e; }
.stat-sub   { font-size: 11px; color: #b0bec5; }

/* ── Skeleton ────────────────────────────────────────── */
.skel { background: linear-gradient(90deg, #f0f2f5 25%, #e3e8f0 50%, #f0f2f5 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; }
@keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }

@media (max-width: 600px) {
  .content { padding: 20px 14px; }
  .hero { padding: 20px 14px 28px; }
  .hero-title { font-size: 20px; }
  .modules-grid { grid-template-columns: 1fr; }
  .stats-row { gap: 10px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-logo" id="hdr-logo">📋</div>
      <div>
        <div class="brand-name" id="hdr-brand">Mock Test Platform</div>
        <div class="brand-sub" id="hdr-tagline">Prepare Smart. Score High.</div>
      </div>
    </div>
    <div class="header-right">
      <span class="hdr-username" id="hdr-name"></span>
      <div class="hdr-avatar" id="hdr-avatar">U</div>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-greet">Welcome back</div>
    <div class="hero-title">Hello, <span id="hero-name">Student</span> 👋</div>
    <div class="hero-sub">Choose a test series below to start your practice session</div>
  </div>
</section>

<div class="content">

  <!-- Stats -->
  <div class="stats-row" id="stats-row" style="display:none">
    <div class="stat-card">
      <div class="stat-label">Total Attempts</div>
      <div class="stat-value" id="s-attempts">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Best Score</div>
      <div class="stat-value" id="s-best">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg Accuracy</div>
      <div class="stat-value" id="s-acc">—</div>
    </div>
    <div class="stat-card" style="flex:0;display:flex;align-items:center;justify-content:center;padding:16px 20px">
      <a href="#" style="font-size:13px;font-weight:700;color:#1565c0;text-decoration:none">📈 View Analysis</a>
    </div>
  </div>

  <!-- Modules -->
  <div class="sec-title">Your Test Series</div>
  <div class="modules-grid" id="modules-grid">
    <!-- skeleton placeholders -->
    <div class="module-card" style="pointer-events:none">
      <div class="skel" style="height:36px;width:36px;border-radius:8px"></div>
      <div class="skel" style="height:16px;width:60%"></div>
      <div class="skel" style="height:12px;width:85%"></div>
    </div>
    <div class="module-card" style="pointer-events:none">
      <div class="skel" style="height:36px;width:36px;border-radius:8px"></div>
      <div class="skel" style="height:16px;width:55%"></div>
      <div class="skel" style="height:12px;width:80%"></div>
    </div>
  </div>

</div>

<script>
const TOKEN = localStorage.getItem("auth_token");
if (!TOKEN) location.href = "/modules/auth/fe/web/login.html";

function logout() {
  localStorage.clear();
  location.href = "/modules/auth/fe/web/login.html";
}

const MODULE_META = {
  "rrb":       { desc: "All Railway Exam Mock Tests — NTPC, Group-D, JE" },
  "rrb-ntpc":  { desc: "Non-Technical Popular Categories CBT 1 & CBT 2" },
  "rrb-group-d": { desc: "Level 1 Posts — Computer Based Test" },
  "exam-engine": { desc: "All available mock tests across exams" },
  "admin":     { desc: "Question bank, exam management, analytics" },
};

function renderModules(modules) {
  const grid = document.getElementById("modules-grid");
  if (!modules || !modules.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px;color:#90a4ae"><div style="font-size:40px;margin-bottom:12px">📭</div><div style="font-size:15px;font-weight:700;color:#546e7a;margin-bottom:6px">No modules available</div><div>Contact your administrator for access</div></div>`;
    return;
  }
  grid.innerHTML = modules.map(m => {
    const meta = MODULE_META[m.id] || {};
    const dest = m.home || `/modules/${m.id}/fe/web/home.html`;
    return `
    <div class="module-card" tabindex="0" role="button"
         onclick="location.href='${dest}'"
         onkeydown="if(event.key==='Enter')location.href='${dest}'">
      <div class="module-icon-row">
        <div class="module-icon">${m.icon || "📋"}</div>
        <div class="module-arrow">→</div>
      </div>
      <div class="module-name">${m.name || m.id}</div>
      <div class="module-desc">${meta.desc || "Practice tests &amp; analysis"}</div>
      <div class="module-footer">
        <span class="module-badge">Start Practice</span>
        <span class="module-cta">Go →</span>
      </div>
    </div>`;
  }).join("");
}

async function init() {
  // Restore cached modules immediately
  const cached = JSON.parse(localStorage.getItem("modules") || "[]");
  if (cached.length) renderModules(cached);

  // User display
  const name  = localStorage.getItem("name") || "";
  const phone = localStorage.getItem("phone") || "";
  const photo = localStorage.getItem("avatar_url") || "";
  const displayName = name || (phone ? phone.slice(-4) : "Student");

  document.getElementById("hdr-name").textContent  = displayName;
  document.getElementById("hero-name").textContent = (name || "Student").split(" ")[0];
  const av = document.getElementById("hdr-avatar");
  if (photo) {
    av.innerHTML = `<img src="${photo}" alt="" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    av.textContent = displayName.slice(0, 1).toUpperCase() || "U";
  }

  // Fresh data from API
  try {
    const res = await fetch("/auth/me", { headers: { Authorization: `Bearer ${TOKEN}` } });
    if (!res.ok) { logout(); return; }
    const data = await res.json();

    localStorage.setItem("modules", JSON.stringify(data.modules || []));
    if (data.name) {
      localStorage.setItem("name", data.name);
      document.getElementById("hdr-name").textContent  = data.name;
      document.getElementById("hero-name").textContent = data.name.split(" ")[0];
      av.textContent = data.name.slice(0, 1).toUpperCase() || "U";
    }

    renderModules(data.modules || []);

    // Tenant branding
    try {
      const tr = await fetch("/tenant/config");
      if (tr.ok) {
        const tc = await tr.json();
        if (tc.logo_emoji) document.getElementById("hdr-logo").textContent    = tc.logo_emoji;
        if (tc.name)       document.getElementById("hdr-brand").textContent   = tc.name;
        if (tc.tagline)    document.getElementById("hdr-tagline").textContent = tc.tagline;
      }
    } catch {}
  } catch {
    // Use cached if API fails
  }
}

init();
</script>
</body>
</html>
