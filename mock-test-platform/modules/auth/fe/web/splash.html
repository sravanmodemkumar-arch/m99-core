<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .splash { text-align:center; }
  .splash-logo { width:72px; height:72px; border-radius:var(--radius-lg); background:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 1.25rem; font-size:2rem; }
  .splash-name { font-size:1.5rem; font-weight:800; color:var(--primary); margin-bottom:0.5rem; }
  .splash-sub { font-size:0.875rem; color:var(--text-muted); margin-bottom:2rem; }
  .spinner { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
<link rel="stylesheet" href="../desktop/desktop.css">
<script src="../desktop/desktop-adapter.js"></script>
</head>
<body>
<div class="splash">
  <div class="splash-logo" id="splash-logo">📋</div>
  <div class="splash-name" id="splash-name">Mock Test</div>
  <div class="splash-sub" id="splash-sub">Loading…</div>
  <div class="spinner"></div>
</div>
<script type="module">
import { boot } from "./app.js";
async function init() {
  const cfg = await boot();
  if (cfg.name) document.getElementById("splash-name").textContent = cfg.name;
  if (cfg.tagline) document.getElementById("splash-sub").textContent = cfg.tagline;
  if (cfg.icon) document.getElementById("splash-logo").innerHTML = `<img src="${cfg.icon}" style="width:100%;height:100%;border-radius:inherit;object-fit:contain">`;
  const token = localStorage.getItem("auth_token");
  setTimeout(() => {
    window.location.href = token ? "home.html" : "landing.html";
  }, 1200);
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
