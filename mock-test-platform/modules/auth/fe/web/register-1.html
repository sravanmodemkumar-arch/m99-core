<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Step 1</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:2.75rem; }
  .pw-toggle { position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); }
  .gender-group { display:flex; gap:0.625rem; }
  .gender-btn { flex:1; padding:0.625rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); cursor:pointer; font-size:0.875rem; font-weight:500; transition:border-color 0.15s; min-height:44px; }
  .gender-btn.selected { border-color:var(--primary); background:#EFF6FF; color:var(--primary); }
</style>
</head>
<body>
<div class="page-center">
<div class="auth-card card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
    <div>
      <div style="font-size:0.75rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em">Step 1 of 3</div>
      <div style="font-size:1.125rem;font-weight:700;color:var(--text)">Personal Info</div>
    </div>
    <button class="mode-toggle" id="mode-toggle">🌙</button>
  </div>
  <div class="progress-bar"><div class="progress-step active"></div><div class="progress-step"></div><div class="progress-step"></div></div>

  <div class="field-row">
    <div class="field"><label>First Name *</label><input type="text" id="first-name" autocomplete="given-name" placeholder="First name"><div class="error" id="fname-error"></div></div>
    <div class="field"><label>Last Name *</label><input type="text" id="last-name" autocomplete="family-name" placeholder="Last name"><div class="error" id="lname-error"></div></div>
  </div>
  <div class="field"><label>Phone Number *</label><input type="tel" id="phone" maxlength="10" inputmode="numeric" autocomplete="tel" placeholder="10-digit mobile number"><div class="error" id="phone-error"></div></div>
  <div class="field"><label>Email Address *</label><input type="email" id="email" autocomplete="email" placeholder="your@email.com"><div class="error" id="email-error"></div></div>
  <div class="field">
    <label>Password *</label>
    <div class="pw-wrap">
      <input type="password" id="password" autocomplete="new-password" placeholder="Min 8 characters" oninput="checkStrength()">
      <button class="pw-toggle" type="button" onclick="togglePw()">👁️</button>
    </div>
    <div class="strength-bar" id="strength-bar"><div class="strength-segment"></div><div class="strength-segment"></div><div class="strength-segment"></div><div class="strength-segment"></div></div>
    <div class="strength-label" id="strength-label"></div>
    <div class="error" id="pw-error"></div>
  </div>
  <div class="field">
    <label>Confirm Password *</label>
    <div class="pw-wrap"><input type="password" id="confirm-pw" autocomplete="new-password" placeholder="Repeat password"></div>
    <div class="error" id="cpw-error"></div>
  </div>
  <div class="field-row">
    <div class="field"><label>Date of Birth *</label><input type="date" id="dob" autocomplete="bday"><div class="error" id="dob-error"></div></div>
    <div class="field">
      <label>Gender *</label>
      <div class="gender-group">
        <button class="gender-btn" onclick="selectGender('M',this)">Male</button>
        <button class="gender-btn" onclick="selectGender('F',this)">Female</button>
        <button class="gender-btn" onclick="selectGender('O',this)">Other</button>
      </div>
      <div class="error" id="gender-error"></div>
    </div>
  </div>

  <div style="margin-bottom:1.25rem;font-size:0.8125rem;color:var(--text-muted)">
    <label style="display:flex;align-items:flex-start;gap:0.5rem;cursor:pointer">
      <input type="checkbox" id="terms" style="width:auto;margin-top:2px">
      <span>I agree to the <a class="link" href="app-info.html">Terms of Service</a> and <a class="link" href="app-info.html">Privacy Policy</a></span>
    </label>
    <div class="error" id="terms-error"></div>
  </div>

  <button class="btn btn-primary" id="next-btn" onclick="nextStep()">Continue →</button>
  <div style="text-align:center;margin-top:1rem;font-size:0.875rem;color:var(--text-muted)">
    Already have an account? <a class="link" href="login.html">Sign In</a>
  </div>

  <div class="divider">or</div>
  <button class="btn-social" onclick="window.location.href='/auth/google'">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continue with Google
  </button>
</div>
</div>
<script type="module">
import { boot, showError, passwordStrength } from "./app.js";
let gender = "";
window.selectGender = (g, btn) => { gender = g; document.querySelectorAll(".gender-btn").forEach(b => b.classList.remove("selected")); btn.classList.add("selected"); };
window.togglePw = () => { const i = document.getElementById("password"); i.type = i.type === "password" ? "text" : "password"; };
window.checkStrength = () => {
  const v = document.getElementById("password").value;
  const s = passwordStrength(v);
  const bar = document.getElementById("strength-bar");
  bar.className = `strength-bar strength-${s}`;
  const labels = ["","Weak","Fair","Good","Strong"];
  document.getElementById("strength-label").textContent = v ? labels[s] : "";
};
window.nextStep = () => {
  let valid = true;
  const required = [["first-name","fname-error"],["last-name","lname-error"],["phone","phone-error"],["email","email-error"],["password","pw-error"],["confirm-pw","cpw-error"],["dob","dob-error"]];
  required.forEach(([id,err]) => { const v = document.getElementById(id).value; if (!v) { showError(err,"Required"); valid = false; } else showError(err,""); });
  if (!gender) { showError("gender-error","Select gender"); valid = false; } else showError("gender-error","");
  if (!document.getElementById("terms").checked) { showError("terms-error","Accept terms to continue"); valid = false; } else showError("terms-error","");
  const pw = document.getElementById("password").value;
  const cpw = document.getElementById("confirm-pw").value;
  if (pw && pw.length < 8) { showError("pw-error","Min 8 characters"); valid = false; }
  if (pw && cpw && pw !== cpw) { showError("cpw-error","Passwords do not match"); valid = false; }
  const phone = document.getElementById("phone").value;
  if (phone && !/^\d{10}$/.test(phone)) { showError("phone-error","Enter valid 10-digit number"); valid = false; }
  if (!valid) return;
  const data = { first_name: document.getElementById("first-name").value, last_name: document.getElementById("last-name").value, phone, email: document.getElementById("email").value, password: pw, dob: document.getElementById("dob").value, gender };
  sessionStorage.setItem("reg_step1", JSON.stringify(data));
  window.location.href = "register-2.html";
};
document.addEventListener("DOMContentLoaded", () => boot());
</script>
</body>
</html>
