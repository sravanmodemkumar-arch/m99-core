<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .profile-hero { display:flex;flex-direction:column;align-items:center;padding:2rem 1.25rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--border);text-align:center; }
  .profile-avatar { width:80px;height:80px;border-radius:50%;font-size:2rem;margin-bottom:0.875rem;border:3px solid var(--primary); }
  .profile-name { font-size:1.25rem;font-weight:700;margin-bottom:0.25rem; }
  .profile-phone { font-size:0.875rem;color:var(--text-muted); }
  .info-section { background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:1rem;overflow:hidden; }
  .info-section-title { font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);padding:0.75rem 1.25rem;background:var(--surface-2);border-bottom:1px solid var(--border); }
  .info-row { display:flex;justify-content:space-between;align-items:center;padding:0.875rem 1.25rem;border-bottom:1px solid var(--border); }
  .info-row:last-child { border-bottom:none; }
  .info-label { font-size:0.8125rem;color:var(--text-muted); }
  .info-value { font-size:0.9375rem;font-weight:500;text-align:right;max-width:60%; }
  .device-item { display:flex;justify-content:space-between;align-items:center;padding:0.75rem 1.25rem;border-bottom:1px solid var(--border); }
  .device-item:last-child { border-bottom:none; }
  .device-icon { font-size:1.25rem;margin-right:0.625rem; }
  .device-current { font-size:0.6875rem;color:var(--success);font-weight:600; }
</style>
</head>
<body>
<div class="page-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="page-header-title">Profile</div>
  <a href="edit-profile.html" style="font-size:0.875rem;font-weight:600;color:var(--primary);text-decoration:none;padding:0.375rem 0.625rem">Edit</a>
</div>

<div id="profile-hero" class="profile-hero">
  <div class="avatar profile-avatar" id="avatar">U</div>
  <div class="profile-name" id="full-name"><div class="skeleton" style="height:1.25rem;width:120px"></div></div>
  <div class="profile-phone" id="phone-display"><div class="skeleton" style="height:0.875rem;width:80px;margin-top:0.25rem"></div></div>
</div>

<div class="container" style="padding-top:1rem">
  <div class="info-section">
    <div class="info-section-title">Personal</div>
    <div class="info-row"><span class="info-label">Email</span><span class="info-value" id="email">—</span></div>
    <div class="info-row"><span class="info-label">Date of Birth</span><span class="info-value" id="dob">—</span></div>
    <div class="info-row"><span class="info-label">Gender</span><span class="info-value" id="gender">—</span></div>
    <div class="info-row"><span class="info-label">Category</span><span class="info-value" id="category">—</span></div>
  </div>

  <div class="info-section">
    <div class="info-section-title">Address</div>
    <div class="info-row"><span class="info-label">State</span><span class="info-value" id="state">—</span></div>
    <div class="info-row"><span class="info-label">City</span><span class="info-value" id="city">—</span></div>
    <div class="info-row"><span class="info-label">Pincode</span><span class="info-value" id="pincode">—</span></div>
    <div class="info-row"><span class="info-label">Address</span><span class="info-value" id="address">—</span></div>
  </div>

  <div class="info-section" id="module-section" style="display:none">
    <div class="info-section-title">Module IDs</div>
    <div id="module-ids"></div>
  </div>

  <div class="info-section">
    <div class="info-section-title">Account</div>
    <div class="info-row"><span class="info-label">Member since</span><span class="info-value" id="created-at">—</span></div>
    <div class="info-row"><span class="info-label">Last login</span><span class="info-value" id="last-login">—</span></div>
    <div class="info-row"><span class="info-label">Active devices</span><span class="info-value" id="device-count">—</span></div>
  </div>

  <div class="info-section">
    <div class="info-section-title">Active Devices</div>
    <div id="devices-list"></div>
  </div>

  <div style="margin-top:1rem;display:flex;flex-direction:column;gap:0.625rem">
    <a href="security.html" class="btn btn-secondary">Security Settings</a>
    <a href="delete-account.html" class="btn" style="background:var(--surface);color:var(--danger);border:1.5px solid var(--danger)">Delete Account</a>
  </div>
</div>

<script type="module">
import { boot, api, requireAuth } from "./app.js";
const GENDER_MAP = { M:"Male", F:"Female", O:"Other" };
const DEVICE_ICONS = { mobile:"📱", tablet:"📟", desktop:"💻", web:"🌐" };

async function init() {
  await boot();
  if (!requireAuth()) return;
  const { ok, data } = await api("/auth/me/profile");
  if (!ok) return;
  render(data);
}

function render(d) {
  const name = `${d.first_name||""} ${d.last_name||""}`.trim() || "—";
  document.getElementById("avatar").textContent = name[0]?.toUpperCase() || "U";
  document.getElementById("full-name").textContent = name;
  document.getElementById("phone-display").textContent = d.phone || "—";
  document.getElementById("email").textContent = d.email || "—";
  document.getElementById("dob").textContent = d.dob ? new Date(d.dob).toLocaleDateString("en-IN") : "—";
  document.getElementById("gender").textContent = GENDER_MAP[d.gender] || d.gender || "—";
  document.getElementById("category").textContent = d.category || "—";
  document.getElementById("state").textContent = d.state || "—";
  document.getElementById("city").textContent = d.city || "—";
  document.getElementById("pincode").textContent = d.pincode || "—";
  document.getElementById("address").textContent = d.address || "—";
  document.getElementById("created-at").textContent = d.created_at ? new Date(d.created_at).toLocaleDateString("en-IN") : "—";
  document.getElementById("last-login").textContent = d.last_login ? new Date(d.last_login).toLocaleString("en-IN") : "—";
  document.getElementById("device-count").textContent = d.devices?.length || 0;
  if (d.photo) { const av = document.getElementById("avatar"); av.innerHTML=`<img src="${d.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`; }
  if (d.module_ids?.length) {
    document.getElementById("module-section").style.display = "block";
    document.getElementById("module-ids").innerHTML = d.module_ids.map(m=>`<div class="info-row"><span class="info-label">${m.module_id}</span><span class="info-value" style="font-family:monospace">${m.user_id}</span></div>`).join("");
  }
  if (d.devices?.length) {
    document.getElementById("devices-list").innerHTML = d.devices.map(dv=>`
      <div class="device-item">
        <div style="display:flex;align-items:center">
          <span class="device-icon">${DEVICE_ICONS[dv.type]||"💻"}</span>
          <div><div style="font-size:0.875rem;font-weight:500">${dv.name||dv.type}</div><div style="font-size:0.75rem;color:var(--text-muted)">${dv.location||""} · ${dv.last_seen?new Date(dv.last_seen).toLocaleDateString("en-IN"):""}</div></div>
        </div>
        ${dv.current?'<span class="device-current">This device</span>':''}
      </div>`).join("");
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
