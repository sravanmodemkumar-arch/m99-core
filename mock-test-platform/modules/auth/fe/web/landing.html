<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3/dist/tailwind.min.css">
<style>
  /* Layout 1 (default): Hero centered + features. Overridden by layout JS */
  .landing-wrap { min-height: 100vh; display: flex; flex-direction: column; }
  .announcement { background: var(--primary); color: #fff; text-align: center; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 500; }
  .announcement a { color: #fff; text-decoration: underline; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1.25rem 2rem; text-align: center; }
  .hero-img { width: 100%; max-width: 480px; border-radius: var(--radius-lg); margin-bottom: 2rem; object-fit: cover; display: none; }
  .hero-img.loaded { display: block; }
  .hero-title { font-size: 2rem; font-weight: 800; line-height: 1.2; color: var(--text); margin-bottom: 0.75rem; }
  .hero-sub { font-size: 1.0625rem; color: var(--text-muted); margin-bottom: 2rem; max-width: 480px; }
  .cta-group { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; max-width: 360px; }
  .stats-bar { display: flex; justify-content: center; gap: 2.5rem; padding: 1.5rem; background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stat-item { text-align: center; }
  .stat-value { font-size: 1.375rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.125rem; }
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; padding: 2rem 1.25rem; max-width: 960px; margin: 0 auto; width: 100%; }
  .feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; text-align: center; }
  .feature-icon { font-size: 2rem; margin-bottom: 0.625rem; }
  .feature-title { font-size: 0.9375rem; font-weight: 600; margin-bottom: 0.25rem; }
  .feature-desc { font-size: 0.8125rem; color: var(--text-muted); }
  .landing-footer { text-align: center; padding: 1.25rem; font-size: 0.8125rem; color: var(--text-muted); border-top: 1px solid var(--border); }
  .landing-footer a { color: var(--text-muted); margin: 0 0.5rem; }
  .header-bar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; background: var(--surface); border-bottom: 1px solid var(--border); }
  .slideshow { position: relative; overflow: hidden; border-radius: var(--radius-lg); margin-bottom: 2rem; width: 100%; max-width: 540px; }
  .slideshow-track { display: flex; transition: transform 0.4s ease; }
  .slideshow-slide { min-width: 100%; }
  .slideshow-slide img { width: 100%; border-radius: var(--radius-lg); aspect-ratio: 16/7; object-fit: cover; }
  .slideshow-dots { display: flex; justify-content: center; gap: 0.375rem; margin-top: 0.75rem; }
  .slideshow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); transition: background 0.2s; cursor: pointer; }
  .slideshow-dot.active { background: var(--primary); }
  @media (min-width: 768px) {
    .hero-title { font-size: 2.75rem; }
    .cta-group { flex-direction: row; }
    .cta-group .btn { flex: 1; }
  }
</style>
<link rel="stylesheet" href="../desktop/desktop.css">
<script src="../desktop/desktop-adapter.js"></script>
</head>
<body>
<div class="landing-wrap" id="landing">
  <!-- Announcement -->
  <div class="announcement" id="announcement" style="display:none">
    <span id="announcement-text"></span>
  </div>

  <!-- Header -->
  <div class="header-bar">
    <div style="display:flex;align-items:center;gap:0.75rem">
      <img id="tenant-logo" src="" alt="" class="tenant-logo" style="display:none">
      <span class="tenant-name" id="tenant-name">Mock Test Platform</span>
    </div>
    <button class="mode-toggle" id="mode-toggle" title="Toggle dark/light">🌙</button>
  </div>

  <!-- Layout content — rendered by landing-layouts.js based on cfg.landing_layout -->
  <div id="layout-content"></div>

  <!-- Footer -->
  <div class="landing-footer" id="landing-footer">
    <a href="app-info.html">Terms</a>
    <a href="app-info.html">Privacy</a>
    <span id="footer-text"></span>
  </div>
</div>

<script type="module">
import { boot } from "./app.js";
import { renderLayout, DEFAULT_LAYOUT } from "../shared/landing-layouts.js";

async function init() {
  const cfg = await boot();
  await loadLanding(cfg);
}

async function loadLanding(cfg) {
  try {
    const res = await fetch("/auth/landing");
    if (!res.ok) return;
    const d = await res.json();

    // Tenant branding
    if (d.name) document.getElementById("tenant-name").textContent = d.name;
    if (d.logo) { const img = document.getElementById("tenant-logo"); img.src = d.logo; img.style.display = "block"; }
    document.title = d.name ? `${d.name} — Mock Tests` : "Mock Test Platform";

    // Render selected layout — replaces static hero/stats/features
    const layoutData = {
      title: d.hero?.title,
      subtitle: d.hero?.subtitle,
      announcement: d.announcement,
      stats: d.stats,
      features: d.features,
      slides: d.slideshow,
      testimonials: d.testimonials,
      toppers: d.toppers,
      exam_date: d.exam_date,
      exam_details: d.exam_details,
      login_label: d.cta?.login_label,
      register_label: d.cta?.register_label,
      logo: d.logo,
      module_name: d.name,
      badge: d.badge,
      tagline: d.tagline,
      hero_emoji: d.hero_emoji,
      notices: d.notices,
      banners: d.banners,
      modules: d.modules,
      ticker_items: d.ticker_items,
    };
    document.getElementById("layout-content").innerHTML = renderLayout(d.layout || DEFAULT_LAYOUT, layoutData);
  } catch {}
}

function renderSlideshow(slides) {
  const track = document.getElementById("slideshow-track");
  const dots = document.getElementById("slideshow-dots");
  document.getElementById("slideshow").style.display = "block";
  slides.forEach((s, i) => {
    track.innerHTML += `<div class="slideshow-slide"><img src="${s.image}" alt="${s.caption||''}"></div>`;
    const dot = document.createElement("div");
    dot.className = `slideshow-dot${i === 0 ? " active" : ""}`;
    dot.onclick = () => goSlide(i);
    dots.appendChild(dot);
  });
  let current = 0;
  function goSlide(n) {
    current = n;
    track.style.transform = `translateX(-${n * 100}%)`;
    dots.querySelectorAll(".slideshow-dot").forEach((d, i) => d.classList.toggle("active", i === n));
  }
  setInterval(() => goSlide((current + 1) % slides.length), 4000);
}

function renderStats(stats) {
  const bar = document.getElementById("stats-bar");
  const list = document.getElementById("stats-list");
  bar.style.display = "flex";
  list.style.cssText = "display:flex;justify-content:center;gap:2.5rem;width:100%";
  list.innerHTML = stats.map(s => `<div class="stat-item"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`).join("");
}

function renderFeatures(features) {
  const el = document.getElementById("features-list");
  el.innerHTML = features.map(f => `
    <div class="feature-card">
      <div class="feature-icon">${f.icon}</div>
      <div class="feature-title">${f.title}</div>
      <div class="feature-desc">${f.desc}</div>
    </div>
  `).join("");
}

window.googleLogin = function() {
  window.location.href = "/auth/google";
};

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
