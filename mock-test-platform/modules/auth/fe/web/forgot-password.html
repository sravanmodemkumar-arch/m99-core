<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:2.75rem; }
  .pw-toggle { position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted); }
  #step-verify,#step-reset,#step-done { display:none; }
</style>
<link rel="stylesheet" href="../desktop/desktop.css">
<script src="../desktop/desktop-adapter.js"></script>
</head>
<body>
<div class="page-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="page-header-title">Forgot Password</div>
  <button class="mode-toggle" id="mode-toggle">🌙</button>
</div>

<div class="page-center" style="min-height:calc(100vh - 56px)">
<div class="auth-card card">

  <!-- Step 1: Enter identifier -->
  <div id="step-identifier">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:2.5rem;margin-bottom:0.75rem">🔑</div>
      <div style="font-size:1.0625rem;font-weight:700;margin-bottom:0.25rem">Reset your password</div>
      <div style="font-size:0.875rem;color:var(--text-muted)" id="identifier-hint">Enter your phone or email</div>
    </div>
    <div class="field">
      <label id="identifier-label">Phone / Email</label>
      <input type="text" id="identifier" placeholder="Enter your identifier" autocomplete="username">
      <div class="error" id="identifier-error"></div>
    </div>
    <button class="btn btn-primary" id="send-btn" onclick="sendReset()">Continue</button>
    <div style="text-align:center;margin-top:1rem">
      <a class="link" href="login.html" style="font-size:0.875rem">← Back to Sign In</a>
    </div>
  </div>

  <!-- Step 2: Verify (OTP inline or email link notice) -->
  <div id="step-verify">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:2.5rem;margin-bottom:0.75rem" id="verify-icon">📱</div>
      <div style="font-size:1.0625rem;font-weight:700;margin-bottom:0.25rem" id="verify-title">Enter OTP</div>
      <div style="font-size:0.875rem;color:var(--text-muted)">Sent to <span id="verify-target" style="color:var(--primary);font-weight:600"></span></div>
    </div>

    <!-- OTP (phone) -->
    <div id="otp-section">
      <div class="field">
        <div class="otp-row" id="otp-row">
          <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
          <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
          <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
        </div>
        <div class="error" id="otp-error"></div>
      </div>
      <button class="btn btn-primary" id="otp-btn" onclick="verifyOtp()">Verify OTP</button>
      <div style="text-align:center;margin-top:0.75rem">
        <button class="link-muted" id="resend-btn" onclick="resendOtp()" disabled>Resend <span id="resend-timer">(30s)</span></button>
      </div>
    </div>

    <!-- Email link notice -->
    <div id="email-section" style="display:none;text-align:center">
      <div style="font-size:0.9375rem;color:var(--text-muted);margin-bottom:1.25rem">Check your inbox and click the reset link. It expires in 15 minutes.</div>
      <button class="btn btn-secondary" onclick="resendEmail()">Resend Email</button>
    </div>

    <div style="text-align:center;margin-top:0.75rem">
      <button class="link-muted" onclick="goStep('identifier')">← Try different identifier</button>
    </div>
  </div>

  <!-- Step 3: New password -->
  <div id="step-reset">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:2.5rem;margin-bottom:0.75rem">🔒</div>
      <div style="font-size:1.0625rem;font-weight:700">Set New Password</div>
    </div>
    <div class="field">
      <label>New Password *</label>
      <div class="pw-wrap">
        <input type="password" id="new-pw" placeholder="Min 8 characters" oninput="checkStrength()">
        <button class="pw-toggle" onclick="togglePw('new-pw')">👁️</button>
      </div>
      <div class="strength-bar" id="strength-bar"><div class="strength-segment"></div><div class="strength-segment"></div><div class="strength-segment"></div><div class="strength-segment"></div></div>
      <div class="strength-label" id="strength-label"></div>
      <div class="error" id="new-pw-error"></div>
    </div>
    <div class="field">
      <label>Confirm Password *</label>
      <div class="pw-wrap">
        <input type="password" id="confirm-pw" placeholder="Repeat new password">
        <button class="pw-toggle" onclick="togglePw('confirm-pw')">👁️</button>
      </div>
      <div class="error" id="confirm-pw-error"></div>
    </div>
    <button class="btn btn-primary" id="reset-btn" onclick="resetPassword()">Set Password</button>
  </div>

  <!-- Step 4: Done -->
  <div id="step-done" style="text-align:center;padding:1rem 0">
    <div style="font-size:3rem;margin-bottom:1rem">✅</div>
    <div style="font-size:1.125rem;font-weight:700;margin-bottom:0.5rem">Password Updated</div>
    <div style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1.5rem">You can now sign in with your new password.</div>
    <button class="btn btn-primary" onclick="window.location.href='login.html'">Sign In</button>
  </div>

</div>
</div>

<script type="module">
import { boot, api, showError, setLoading, otpAutoAdvance, getOtpValue, detectIdentifier, passwordStrength } from "./app.js";
let state = {};
let resendInterval;

async function init() {
  const cfg = await boot();
  const via = cfg.forgot_password?.via || ["email","phone"];
  const label = via.map(v => v.charAt(0).toUpperCase()+v.slice(1)).join(" / ");
  document.getElementById("identifier-label").textContent = label;
  document.getElementById("identifier-hint").textContent = `Enter your ${label.toLowerCase()}`;
  otpAutoAdvance("#otp-row");
}

window.goStep = function(step) {
  ["identifier","verify","reset","done"].forEach(s => document.getElementById(`step-${s}`).style.display = s === step ? "block" : "none");
};

window.sendReset = async function() {
  const val = document.getElementById("identifier").value.trim();
  if (!val) { showError("identifier-error","Required"); return; }
  showError("identifier-error","");
  setLoading("send-btn", true, "Continue");
  const type = detectIdentifier(val);
  const { ok, data } = await api("/auth/forgot-password", { method:"POST", body: JSON.stringify({ identifier: val, type }) });
  setLoading("send-btn", false, "Continue");
  if (!ok) { showError("identifier-error", data.error || "Not found"); return; }
  state.session_token = data.session_token;
  state.method = data.method;
  document.getElementById("verify-target").textContent = data.target || val;
  if (data.method === "email") {
    document.getElementById("verify-icon").textContent = "📧";
    document.getElementById("verify-title").textContent = "Check your email";
    document.getElementById("otp-section").style.display = "none";
    document.getElementById("email-section").style.display = "block";
  } else {
    startResendTimer(30);
    document.querySelector("#otp-row input").focus();
  }
  goStep("verify");
};

window.verifyOtp = async function() {
  const otp = getOtpValue("#otp-row");
  if (otp.length !== 6) { showError("otp-error","Enter all 6 digits"); return; }
  showError("otp-error","");
  setLoading("otp-btn", true, "Verify OTP");
  const { ok, data } = await api("/auth/forgot-password/verify", { method:"POST", body: JSON.stringify({ session_token: state.session_token, otp }) });
  setLoading("otp-btn", false, "Verify OTP");
  if (!ok) { showError("otp-error", data.error || "Invalid OTP"); return; }
  state.reset_token = data.reset_token;
  goStep("reset");
};

window.resendOtp = async function() {
  document.querySelectorAll("#otp-row input").forEach(i => i.value="");
  document.querySelector("#otp-row input").focus();
  await api("/auth/forgot-password/resend", { method:"POST", body: JSON.stringify({ session_token: state.session_token }) });
  startResendTimer(30);
};

window.resendEmail = async function() {
  await api("/auth/forgot-password/resend", { method:"POST", body: JSON.stringify({ session_token: state.session_token }) });
};

window.resetPassword = async function() {
  const pw = document.getElementById("new-pw").value;
  const cpw = document.getElementById("confirm-pw").value;
  showError("new-pw-error",""); showError("confirm-pw-error","");
  if (!pw || pw.length < 8) { showError("new-pw-error","Min 8 characters"); return; }
  if (pw !== cpw) { showError("confirm-pw-error","Passwords do not match"); return; }
  setLoading("reset-btn", true, "Set Password");
  const { ok, data } = await api("/auth/reset-password", { method:"POST", body: JSON.stringify({ reset_token: state.reset_token, password: pw }) });
  setLoading("reset-btn", false, "Set Password");
  if (!ok) { showError("confirm-pw-error", data.error || "Failed"); return; }
  goStep("done");
};

window.togglePw = id => { const i = document.getElementById(id); i.type = i.type==="password"?"text":"password"; };
window.checkStrength = () => {
  const v = document.getElementById("new-pw").value;
  const s = passwordStrength(v);
  document.getElementById("strength-bar").className = `strength-bar strength-${s}`;
  document.getElementById("strength-label").textContent = v ? ["","Weak","Fair","Good","Strong"][s] : "";
};

function startResendTimer(s) {
  const btn = document.getElementById("resend-btn"), timer = document.getElementById("resend-timer");
  btn.disabled=true; clearInterval(resendInterval);
  resendInterval = setInterval(()=>{ s--; timer.textContent=s>0?`(${s}s)`:""; if(s<=0){clearInterval(resendInterval);btn.disabled=false;} },1000);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
