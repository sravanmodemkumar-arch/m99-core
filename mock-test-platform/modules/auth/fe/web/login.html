<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .pw-toggle { position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-muted); font-size:1rem; padding:0.25rem; }
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:2.75rem; }
  .strength-label { font-size:0.75rem; color:var(--text-muted); margin-top:0.375rem; }
  .totp-note { font-size:0.8125rem; color:var(--text-muted); text-align:center; margin-top:0.75rem; }
  #step-otp, #step-totp { display:none; }
</style>
<link rel="stylesheet" href="../desktop/desktop.css">
<script src="../desktop/desktop-adapter.js"></script>
</head>
<body>
<!-- Desktop: two-column. Mobile/web: only .auth-layout-main is visible -->
<div class="auth-layout">
  <div class="auth-layout-aside" style="display:none">
    <div class="aside-title" id="aside-title">Mock Test Platform</div>
    <div class="aside-subtitle" id="aside-subtitle">India's most trusted exam preparation platform</div>
  </div>
  <div class="auth-layout-main">
<div class="page-center" style="width:100%">
<div class="auth-card card">
  <!-- Branding -->
  <div style="text-align:center;margin-bottom:1.5rem">
    <div class="tenant-name" id="tenant-name">Mock Test</div>
    <div class="tenant-tagline" id="tenant-tagline">Sign in to continue</div>
  </div>

  <!-- Step 1: Identifier + Password -->
  <div id="step-credentials">
    <div class="field">
      <label for="identifier" id="identifier-label">Phone / Email / Username / ID</label>
      <input type="text" id="identifier" autocomplete="username" placeholder="Enter your identifier" inputmode="text">
      <div class="error" id="identifier-error"></div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter password">
        <button class="pw-toggle" type="button" onclick="togglePw('password','pw-eye')">👁️</button>
      </div>
      <div class="error" id="password-error"></div>
    </div>
    <div style="text-align:right;margin-bottom:1rem;margin-top:-0.5rem">
      <a class="link" href="forgot-password.html" style="font-size:0.875rem">Forgot password?</a>
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="submitCredentials()">Sign In</button>

    <div class="divider">or</div>
    <button class="btn-social" id="google-btn" onclick="googleLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>

    <div style="text-align:center;margin-top:1.25rem;font-size:0.875rem;color:var(--text-muted)">
      No account? <a class="link" href="register-1.html" id="register-link">Register</a>
    </div>
  </div>

  <!-- Step 2: OTP (if module requires) -->
  <div id="step-otp">
    <div style="text-align:center;margin-bottom:1.25rem">
      <div style="font-size:0.9375rem;font-weight:600;margin-bottom:0.25rem">Enter OTP</div>
      <div style="font-size:0.8125rem;color:var(--text-muted)">Sent to <span id="otp-target" style="color:var(--primary)"></span></div>
    </div>
    <div class="field">
      <div class="otp-row" id="otp-row">
        <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
      </div>
      <div class="error" id="otp-error"></div>
    </div>
    <button class="btn btn-primary" id="otp-btn" onclick="submitOtp()">Verify OTP</button>
    <div style="text-align:center;margin-top:0.75rem">
      <button class="link-muted" id="resend-btn" onclick="resendOtp()" disabled>Resend OTP <span id="resend-timer">(30s)</span></button>
    </div>
    <div style="text-align:center;margin-top:0.5rem">
      <button class="link-muted" onclick="goStep('credentials')">← Back</button>
    </div>
  </div>

  <!-- Step 3: TOTP (if module requires) -->
  <div id="step-totp">
    <div style="text-align:center;margin-bottom:1.25rem">
      <div style="font-size:1.5rem;margin-bottom:0.5rem">🔐</div>
      <div style="font-size:0.9375rem;font-weight:600;margin-bottom:0.25rem">Authenticator Code</div>
      <div style="font-size:0.8125rem;color:var(--text-muted)">Enter the 6-digit code from your authenticator app</div>
    </div>
    <div class="field">
      <div class="otp-row" id="totp-row">
        <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric"><input type="tel" maxlength="1" inputmode="numeric">
      </div>
      <div class="error" id="totp-error"></div>
    </div>
    <button class="btn btn-primary" id="totp-btn" onclick="submitTotp()">Verify</button>
    <div class="totp-note">Code refreshes every 30 seconds</div>
  </div>

  <div style="display:flex;justify-content:flex-end;margin-top:1.5rem">
    <button class="mode-toggle" id="mode-toggle">🌙</button>
  </div>
</div>
</div>

<script type="module">
import { boot, api, showError, setLoading, otpAutoAdvance, getOtpValue, detectIdentifier, requireGuest } from "./app.js";
let authState = {};
let resendInterval;

async function init() {
  const cfg = await boot();
  if (!requireGuest()) return;
  if (cfg.name) document.getElementById("tenant-name").textContent = cfg.name;
  if (cfg.tagline) document.getElementById("tenant-tagline").textContent = cfg.tagline;
  // Dynamic identifier label
  const allowed = cfg.identifiers || ["phone","email"];
  document.getElementById("identifier-label").textContent = allowed.map(a => a.charAt(0).toUpperCase()+a.slice(1)).join(" / ");
  // Hide register if self-registration disabled
  if (!cfg.registration?.self) document.getElementById("register-link").style.display = "none";
  // Hide Google if not in social
  if (!cfg.social?.includes("google")) document.getElementById("google-btn").style.display = "none";
  otpAutoAdvance("#otp-row");
  otpAutoAdvance("#totp-row");
}

window.togglePw = function(inputId, iconId) {
  const inp = document.getElementById(inputId);
  inp.type = inp.type === "password" ? "text" : "password";
};

window.goStep = function(step) {
  document.getElementById("step-credentials").style.display = step === "credentials" ? "block" : "none";
  document.getElementById("step-otp").style.display = step === "otp" ? "block" : "none";
  document.getElementById("step-totp").style.display = step === "totp" ? "block" : "none";
};

window.submitCredentials = async function() {
  const identifier = document.getElementById("identifier").value.trim();
  const password = document.getElementById("password").value;
  showError("identifier-error",""); showError("password-error","");
  if (!identifier) { showError("identifier-error","Required"); return; }
  if (!password) { showError("password-error","Required"); return; }
  setLoading("login-btn", true, "Sign In");
  const { ok, data } = await api("/auth/login", { method:"POST", body: JSON.stringify({ identifier, password, identifier_type: detectIdentifier(identifier) }) });
  setLoading("login-btn", false, "Sign In");
  if (!ok) { showError("password-error", data.error || "Invalid credentials"); return; }
  authState = { ...data, identifier };
  if (data.next === "otp") {
    document.getElementById("otp-target").textContent = data.otp_target || identifier;
    startResendTimer(30);
    goStep("otp");
  } else if (data.next === "totp") {
    goStep("totp");
  } else {
    finishLogin(data);
  }
};

window.submitOtp = async function() {
  const otp = getOtpValue("#otp-row");
  if (otp.length !== 6) { showError("otp-error","Enter all 6 digits"); return; }
  showError("otp-error","");
  setLoading("otp-btn", true, "Verify OTP");
  const { ok, data } = await api("/auth/login/otp", { method:"POST", body: JSON.stringify({ session_token: authState.session_token, otp }) });
  setLoading("otp-btn", false, "Verify OTP");
  if (!ok) { showError("otp-error", data.error || "Invalid OTP"); return; }
  if (data.next === "totp") { goStep("totp"); return; }
  finishLogin(data);
};

window.submitTotp = async function() {
  const code = getOtpValue("#totp-row");
  if (code.length !== 6) { showError("totp-error","Enter all 6 digits"); return; }
  showError("totp-error","");
  setLoading("totp-btn", true, "Verify");
  const { ok, data } = await api("/auth/login/totp", { method:"POST", body: JSON.stringify({ session_token: authState.session_token, code }) });
  setLoading("totp-btn", false, "Verify");
  if (!ok) { showError("totp-error", data.error || "Invalid code"); return; }
  finishLogin(data);
};

window.resendOtp = async function() {
  await api("/auth/otp/resend", { method:"POST", body: JSON.stringify({ session_token: authState.session_token }) });
  document.querySelectorAll("#otp-row input").forEach(i => i.value = "");
  document.querySelector("#otp-row input").focus();
  startResendTimer(30);
};

window.googleLogin = function() { window.location.href = "/auth/google"; };

function startResendTimer(s) {
  const btn = document.getElementById("resend-btn");
  const timer = document.getElementById("resend-timer");
  btn.disabled = true; clearInterval(resendInterval);
  resendInterval = setInterval(() => {
    s--; timer.textContent = s > 0 ? `(${s}s)` : "";
    if (s <= 0) { clearInterval(resendInterval); btn.disabled = false; }
  }, 1000);
}

function finishLogin(data) {
  localStorage.setItem("auth_token", data.token);
  localStorage.setItem("uid", data.uid);
  localStorage.setItem("modules", JSON.stringify(data.modules || []));
  const mods = data.modules || [];
  if (mods.length === 1) window.location.href = `/web/${mods[0].id}/`;
  else if (mods.length === 0) { showError("password-error","No active subscription"); }
  else window.location.href = "home.html";
}

document.addEventListener("DOMContentLoaded", init);
</script>
</div></div></div><!-- /auth-layout -->
</body>
</html>
