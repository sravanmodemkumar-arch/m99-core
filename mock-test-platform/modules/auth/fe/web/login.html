<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Mock Test Platform</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
  .login-card { width: 100%; max-width: 380px; }
  .brand { text-align: center; margin-bottom: 2rem; }
  .brand-name { font-size: 1.375rem; font-weight: 800; color: var(--primary); }
  .brand-sub  { font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem; }
  .step { display: none; }
  .step.active { display: block; }
  .otp-row { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1.25rem; }
  .otp-row input { width: 2.75rem; height: 3rem; text-align: center; font-size: 1.25rem; font-weight: 700; padding: 0; border-radius: var(--radius-sm); }
  .error { color: var(--danger); font-size: 0.8125rem; margin-top: 0.375rem; min-height: 1.2em; }
  .back-link { font-size: 0.8125rem; color: var(--text-muted); text-align: center; margin-top: 1rem; cursor: pointer; }
  .back-link:hover { color: var(--primary); }
  #timer-text { font-size: 0.8125rem; color: var(--text-muted); text-align: center; margin-top: 0.75rem; }
  #timer-text a { color: var(--primary); cursor: pointer; }
</style>
</head>
<body>

<div class="login-card card">
  <div class="brand">
    <div class="brand-name">Mock Test Platform</div>
    <div class="brand-sub">India's most trusted exam prep</div>
  </div>

  <!-- Step 1: Phone -->
  <div class="step active" id="step-phone">
    <div class="field">
      <label for="phone">Mobile Number</label>
      <input type="tel" id="phone" maxlength="10" inputmode="numeric"
             placeholder="10-digit mobile number"
             onkeydown="if(event.key==='Enter') sendOtp()">
      <div class="error" id="phone-error"></div>
    </div>
    <button class="btn btn-primary" id="send-btn" onclick="sendOtp()">Send OTP</button>
  </div>

  <!-- Step 2: OTP -->
  <div class="step" id="step-otp">
    <div style="text-align:center;margin-bottom:1.25rem">
      <div style="font-size:0.9375rem;font-weight:600;margin-bottom:0.25rem">Enter OTP</div>
      <div style="font-size:0.8125rem;color:var(--text-muted)">Sent to <span id="phone-display" style="color:var(--primary);font-weight:600"></span></div>
    </div>
    <div class="otp-row" id="otp-boxes">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
    </div>
    <div class="error" id="otp-error"></div>
    <button class="btn btn-primary" id="verify-btn" onclick="verifyOtp()">Verify &amp; Sign In</button>
    <div id="timer-text"></div>
    <div class="back-link" onclick="goBack()">← Change number</div>
  </div>
</div>

<script type="module">
const TENANT = "mtp-main";
let phone = "";
let resendTimer = null;

const boxes = document.querySelectorAll("#otp-boxes input");
boxes.forEach((box, i) => {
  box.addEventListener("input", () => {
    box.value = box.value.replace(/\D/g, "").slice(-1);
    if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
  });
  box.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !box.value && i > 0) boxes[i - 1].focus();
    if (e.key === "Enter") verifyOtp();
  });
  box.addEventListener("paste", (e) => {
    const paste = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
    [...paste].forEach((ch, j) => { if (boxes[i + j]) boxes[i + j].value = ch; });
    boxes[Math.min(i + paste.length, boxes.length - 1)].focus();
    e.preventDefault();
  });
});

function getOtp() { return [...boxes].map(b => b.value).join(""); }

window.sendOtp = async function() {
  phone = document.getElementById("phone").value.trim();
  if (!/^\d{10}$/.test(phone)) {
    document.getElementById("phone-error").textContent = "Enter a valid 10-digit number";
    return;
  }
  document.getElementById("phone-error").textContent = "";
  const btn = document.getElementById("send-btn");
  btn.disabled = true; btn.textContent = "Sending…";

  try {
    const res = await fetch("/auth/otp/request", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to send OTP");
    document.getElementById("phone-display").textContent = phone;
    show("step-otp");
    boxes[0].focus();
    startResendTimer(30);
  } catch (err) {
    document.getElementById("phone-error").textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = "Send OTP";
  }
};

window.verifyOtp = async function() {
  const otp = getOtp();
  if (otp.length < 6) {
    document.getElementById("otp-error").textContent = "Enter the 6-digit OTP";
    return;
  }
  document.getElementById("otp-error").textContent = "";
  const btn = document.getElementById("verify-btn");
  btn.disabled = true; btn.textContent = "Verifying…";

  try {
    const res = await fetch("/auth/otp/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, otp, tenantId: TENANT }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Invalid OTP");
    localStorage.setItem("auth_token", data.token);
    localStorage.setItem("uid",  data.uid);
    localStorage.setItem("role", data.role);
    window.location.href = "/modules/rrb-group-d/fe/web/home.html";
  } catch (err) {
    document.getElementById("otp-error").textContent = err.message;
    boxes.forEach(b => b.value = ""); boxes[0].focus();
  } finally {
    btn.disabled = false; btn.textContent = "Verify & Sign In";
  }
};

function show(id) {
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

window.goBack = function() {
  clearInterval(resendTimer);
  document.getElementById("timer-text").textContent = "";
  boxes.forEach(b => b.value = "");
  document.getElementById("otp-error").textContent = "";
  show("step-phone");
};

function startResendTimer(seconds) {
  let s = seconds;
  clearInterval(resendTimer);
  const el = document.getElementById("timer-text");
  el.textContent = `Resend OTP in ${s}s`;
  resendTimer = setInterval(() => {
    s--;
    if (s <= 0) {
      clearInterval(resendTimer);
      el.innerHTML = `Didn't receive OTP? <a onclick="window.resendOtp()">Resend</a>`;
    } else {
      el.textContent = `Resend OTP in ${s}s`;
    }
  }, 1000);
}

window.resendOtp = function() {
  boxes.forEach(b => b.value = ""); boxes[0].focus();
  window.sendOtp();
};
</script>
</body>
</html>
