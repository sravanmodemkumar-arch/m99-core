<!--
  HTMX shared component: Page Header
  Used on every inner page. Back button + title + mode toggle.
-->
<div class="page-header" data-component="page-header">
  <button type="button" class="back-btn" data-back-btn onclick="history.back()">←</button>
  <div class="page-header-title" data-header-title></div>
  <button type="button" class="mode-toggle" data-mode-toggle id="mode-toggle">🌙</button>
</div>
