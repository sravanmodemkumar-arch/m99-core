<!--
  HTMX shared component: Password Field with toggle + optional strength bar
  Params: ?id=<input-id>  ?label=<label>  ?strength=1  ?error_id=<id>
-->
<div class="field" data-component="password-field">
  <label data-pw-label>Password</label>
  <div class="pw-wrap">
    <input type="password" data-pw-input autocomplete="current-password" placeholder="Enter password">
    <button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">👁️</button>
  </div>
  <div class="pw-strength" data-pw-strength style="display:none">
    <div class="pw-strength-bar">
      <div class="pw-strength-fill" data-pw-fill></div>
    </div>
    <span class="pw-strength-label" data-pw-label-strength></span>
  </div>
  <div class="error" data-pw-error></div>
</div>
