  HTMX shared component: Avatar
  Shows photo if available, else initials. Sizes: sm (32px), md (48px), lg (80px)
-->
<div class="avatar" data-component="avatar" data-avatar-size="md">
  <span data-avatar-initials>U</span>
  <img data-avatar-img style="display:none;width:100%;height:100%;border-radius:50%;object-fit:cover" alt="">
</div>
