<!--
  HTMX shared component: FAQ Accordion Item
  Data injected by components.js renderFaqItem(index, q, a).
-->
<div class="faq-item" data-component="faq-item">
  <div class="faq-question" data-faq-question>
    <span data-faq-q></span>
    <span class="faq-arrow">›</span>
  </div>
  <div class="faq-answer" data-faq-a></div>
</div>
