<!--
  HTMX shared component: Empty State
  Used when a list has no items.
-->
<div class="empty-state" data-component="empty-state" style="text-align:center;padding:3rem 1rem">
  <div style="font-size:3rem;margin-bottom:1rem" data-empty-icon>📭</div>
  <div style="font-size:1rem;font-weight:600;margin-bottom:0.5rem" data-empty-title></div>
  <div style="font-size:0.875rem;color:var(--text-muted)" data-empty-desc></div>
</div>
